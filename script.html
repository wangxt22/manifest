<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FFF3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reverie">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>剧本 · Reverie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg-image:none;
  --bg-gradient:
    radial-gradient(1200px 800px at 15% -10%,#F5CDDB 0%,transparent 55%),
    radial-gradient(1000px 700px at 100% 100%,#F6D5DE 0%,transparent 60%),
    #FFF3F7;
  --surface:rgba(255,253,254,.88);
  --surface-solid:#FFFCFD;
  --pearl:#F1E3E8;
  --rose:#D4A5B0;
  --rose-deep:#A87682;
  --rose-soft:#E9C4CD;
  --gold:#C9A87A;
  --t1:#5A3D4A;--t2:#8B6B7A;--t3:#B89AAA;
  --serif-en:'Cormorant Garamond',serif;
  --sans-en:'Inter',-apple-system,sans-serif;
  --serif-cn:'Noto Serif SC',serif;
  --sans-cn:-apple-system,'PingFang SC',sans-serif;
  --r-card:20px;--r-pill:999px;
  --shadow-card:0 6px 24px rgba(180,120,130,.14),inset 0 1px 0 rgba(255,255,255,.9);
}
html{height:100%}
body{
  font-family:var(--sans-cn);color:var(--t1);font-size:15px;
  background-color:#FFF3F7;
  background-image:var(--bg-image),var(--bg-gradient);
  background-size:cover;background-position:center;
  background-attachment:fixed;background-repeat:no-repeat;
  min-height:100%;overflow-x:hidden;
  /* 底 tabbar 是 fixed 的，首页那个球还往上凸 22px —— 留够，别让内容被压在底下 */
  padding-bottom:calc(118px + env(safe-area-inset-bottom));
}
.phone{max-width:420px;margin:0 auto;position:relative;padding:0 14px;padding-top:calc(env(safe-area-inset-top,20px) + 12px)}

/* ===== Section title ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 12px}
.sec:first-of-type{margin-top:0}
.sec-l{display:flex;align-items:baseline;gap:8px}
.sec-l .en{font-family:var(--serif-en);font-size:20px;font-weight:500;color:var(--t1);font-style:italic;letter-spacing:.4px}
.sec-l .cn{font-family:var(--serif-cn);font-size:11px;color:var(--t2);letter-spacing:2px}
.sec-r{font-size:11px;color:var(--t3);letter-spacing:.5px;font-family:var(--sans-en)}

/* Cormorant 默认走老式数字，"1" 会长成小写 I —— 所有数字位强制 lining figures */
.dot,.st-n,.d-stat .n,.db-d .n,.np-day,.sc-badge,.np-scene .lead,.act-lb,.sc-meta{
  font-variant-numeric:lining-nums;
  font-feature-settings:"lnum" 1,"onum" 0;
}
/* ===== Now playing · horizontal swipe carousel ===== */
.np-wrap{
  display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding-bottom:2px;
}
.np-wrap::-webkit-scrollbar{display:none}
.np-card{
  flex:0 0 100%;scroll-snap-align:start;
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  padding:18px;position:relative;overflow:hidden;cursor:pointer;
}
.np-card::after{
  content:'';position:absolute;right:-34px;top:-34px;
  width:120px;height:120px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,165,176,.16),transparent 70%);
  pointer-events:none;
}
.np-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.np-name{font-family:var(--serif-cn);font-weight:600;font-size:16.5px;color:var(--t1);letter-spacing:.5px}
.np-cat{font-size:10.5px;color:var(--t3);letter-spacing:1.5px;margin-top:4px;font-family:var(--sans-cn)}
.np-day{
  flex:0 0 auto;font-family:var(--sans-en);font-size:11px;font-weight:500;
  letter-spacing:1px;color:var(--rose-deep);padding:4px 11px;
  border-radius:var(--r-pill);background:rgba(212,165,176,.14);
}
/* 7-dot week window */
.dots{position:relative;padding:8px 0 2px;margin:14px 2px 4px}
.dots::before{
  content:'';position:absolute;left:11px;right:11px;top:calc(50% + 3px);height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--pearl) 15%,var(--pearl) 85%,transparent 100%);
  transform:translateY(-50%);
}
.dots-row{display:flex;justify-content:space-between;position:relative;z-index:1}
.dot{
  width:25px;height:25px;border-radius:50%;display:grid;place-items:center;
  background:var(--surface-solid);border:1px solid var(--pearl);
  font-family:var(--serif-en);font-size:11px;color:var(--t3);font-weight:500;
}
.dot.done{background:rgba(212,165,176,.12);border-color:rgba(212,165,176,.35);color:var(--rose-deep)}
.dot.cur{
  background:linear-gradient(145deg,var(--rose),var(--rose-deep));
  border-color:transparent;color:#fff;font-weight:600;
  width:29px;height:29px;box-shadow:0 3px 10px rgba(168,118,130,.35);
}
.dots-wk{font-size:10px;color:var(--t3);letter-spacing:1px;margin:2px 2px 0;font-family:var(--sans-cn)}
/* Scene lines inside now-playing card (max 2, clamp 2 lines each) */
.np-scenes{margin-top:10px;padding-top:12px;border-top:.5px dashed rgba(212,165,176,.35)}
.np-scene{position:relative;padding-left:14px}
.np-scene + .np-scene{margin-top:11px}
.np-scene::before{
  content:'';position:absolute;left:0;top:3px;bottom:3px;width:2px;
  background:linear-gradient(180deg,var(--rose),transparent);
  border-radius:2px;opacity:.55;
}
.np-scene .lead{
  font-family:var(--serif-en);font-style:italic;font-size:11.5px;
  color:var(--rose-deep);letter-spacing:.5px;display:block;margin-bottom:3px;
}
.np-scene .lead .cn{font-family:var(--serif-cn);font-style:normal;font-size:10.5px;color:var(--t3);margin-left:5px;letter-spacing:1px}
.np-scene .txt{
  font-family:var(--serif-cn);font-weight:500;font-size:13.5px;line-height:1.8;color:var(--t1);
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.np-scene .txt.empty{color:var(--t3);font-family:var(--sans-cn);font-size:12.5px}
.np-more{
  margin-top:11px;font-size:11.5px;color:var(--rose-deep);letter-spacing:.5px;
  display:flex;align-items:center;gap:4px;
}
.np-more svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
/* Carousel page indicator */
.np-ind{display:flex;justify-content:center;gap:5px;margin-top:10px}
.np-ind i{
  width:5px;height:5px;border-radius:50%;background:rgba(212,165,176,.32);
  transition:all .25s;
}
.np-ind i.on{width:16px;border-radius:3px;background:var(--rose-deep)}
/* Empty state for now-playing */
.np-empty{
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-card);box-shadow:var(--shadow-card);
  padding:30px 22px;text-align:center;
}
.np-empty .en{font-family:var(--serif-en);font-style:italic;font-size:16px;color:var(--rose-soft);display:block;margin-bottom:7px}
.np-empty .cn{font-family:var(--serif-cn);font-size:13px;color:var(--t3);line-height:1.9}
/* ===== Category chips ===== */
.chips{
  display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  margin:0 -14px 14px;padding:2px 14px 4px;
}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;padding:7px 15px;border-radius:var(--r-pill);
  font-size:12.5px;color:var(--t2);cursor:pointer;white-space:nowrap;
  border:.5px solid rgba(212,165,176,.4);
  background:rgba(255,255,255,.6);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  font-family:var(--sans-cn);transition:all .2s;
}
.chip.on{
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  color:#fff;border-color:transparent;font-weight:500;
  box-shadow:0 3px 9px rgba(168,118,130,.3);
}
.chip.add{color:var(--rose-deep);border-style:dashed;background:rgba(255,255,255,.42)}
/* 长按胶囊挪位置 */
.chip.drag{
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;
  border-color:transparent;
  box-shadow:0 8px 20px rgba(168,118,130,.42);
  opacity:.92;z-index:2;
  /* 手指底下这个不能有过渡 —— .chip 上那条 transition:all .2s 会让它拖不跟手 */
  transition:none;
}
/* 让位的胶囊滑过去 */
.chips.sorting .chip:not(.drag){transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.chips.sorting .chip.fixed{opacity:.42}

/* ===== Script grid (2 columns) ===== */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sc{
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:18px;box-shadow:0 5px 18px rgba(180,120,130,.12),inset 0 1px 0 rgba(255,255,255,.9);
  overflow:hidden;cursor:pointer;transition:transform .15s;
  display:flex;flex-direction:column;
}
.sc:active{transform:scale(.985)}
.sc-cover{
  aspect-ratio:3/4;position:relative;
  background-size:cover;background-position:center;
  display:flex;align-items:flex-end;padding:12px;
}
.sc-cover::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(180deg,transparent 42%,rgba(90,61,74,.42) 100%);
}
.sc-cover .line{
  position:relative;z-index:1;
  font-family:var(--serif-en);font-style:italic;font-weight:600;
  font-size:14px;line-height:1.35;color:#fff;letter-spacing:.3px;
  text-shadow:0 1px 6px rgba(90,61,74,.4);
}
.sc-badge{
  position:absolute;top:9px;left:9px;z-index:2;
  font-size:9.5px;letter-spacing:1px;padding:3px 8px;border-radius:var(--r-pill);
  background:rgba(255,253,254,.86);backdrop-filter:blur(8px);
  color:var(--rose-deep);font-family:var(--sans-cn);font-weight:500;
}
.sc-body{padding:11px 12px 13px;display:flex;flex-direction:column;flex:1}
.sc-name{font-family:var(--serif-cn);font-weight:600;font-size:14.5px;color:var(--t1);letter-spacing:.5px}
.sc-why{margin-top:7px;flex:1}
.sc-why .lb{
  font-size:9.5px;color:var(--gold);letter-spacing:1.5px;
  font-family:var(--sans-cn);font-weight:500;
}
.sc-why .tx{
  font-size:11.5px;color:var(--t2);line-height:1.65;margin-top:3px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.sc-meta{
  font-size:10.5px;color:var(--t3);letter-spacing:.5px;
  margin-top:9px;padding-top:8px;border-top:.5px dashed var(--pearl);
  font-family:var(--sans-cn);
}
.sc-ops{display:flex;gap:6px;margin-top:9px}
.sc-btn{
  flex:1;padding:7px 0;border-radius:var(--r-pill);border:none;cursor:pointer;
  font-size:11.5px;font-family:var(--sans-cn);text-align:center;letter-spacing:.5px;
}
.sc-btn.ghost{
  background:rgba(255,255,255,.6);color:var(--t2);
  border:.5px solid rgba(212,165,176,.4);
}
.sc-btn.fill{
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;font-weight:500;
  box-shadow:0 3px 9px rgba(168,118,130,.28);
}
/* Archived cards look faded */
.sc.arch .sc-cover{filter:saturate(.35) brightness(1.04)}
.sc.arch .sc-name{color:var(--t2)}
/* "write your own" dashed card */
.sc.new{
  border:1.2px dashed rgba(212,165,176,.6);
  background:rgba(255,255,255,.42);box-shadow:none;
  align-items:center;justify-content:center;min-height:210px;padding:20px 14px;
}
.sc.new .ic{
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(145deg,var(--rose),var(--rose-deep));
  display:grid;place-items:center;
  box-shadow:0 6px 16px rgba(168,118,130,.34),inset 0 1px 0 rgba(255,255,255,.35);
}
.sc.new .ic svg{width:21px;height:21px;stroke:#fff;stroke-width:2.1;fill:none;stroke-linecap:round}
.sc.new .tt{font-family:var(--serif-cn);font-weight:600;font-size:14px;color:var(--t1);margin-top:12px;text-align:center}
.sc.new .ss{font-size:11px;color:var(--t3);margin-top:5px;text-align:center;line-height:1.6}
.grid-empty{
  grid-column:1 / -1;text-align:center;padding:30px 20px;
  font-family:var(--serif-cn);font-size:13px;color:var(--t3);line-height:1.9;
}
/* ===== Cover gradient fallbacks (used when no photo uploaded) ===== */
.cv1{background-image:linear-gradient(150deg,#F4C2CE,#E07A9B)}
.cv2{background-image:linear-gradient(150deg,#E4C4F0,#A87FD4)}
.cv3{background-image:linear-gradient(150deg,#F4DDB8,#C9A268)}
.cv4{background-image:linear-gradient(150deg,#C4D6F4,#6E8FD4)}
.cv5{background-image:linear-gradient(150deg,#C8E8DC,#6FAE9B)}
.cv6{background-image:linear-gradient(150deg,#FCE0E9,#EFA8BE)}
.cv7{background-image:linear-gradient(150deg,#D9C8F0,#8E7BC4)}
.cv8{background-image:linear-gradient(150deg,#E8DFF4,#9AA8D4)}

/* ===== Mask ===== */
.mask{position:fixed;inset:0;background:rgba(90,61,74,.34);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
.mask.on{opacity:1;pointer-events:auto}

/* ===== Full page: script detail ===== */
.page{
  position:fixed;inset:0;z-index:85;overflow-y:auto;scrollbar-width:none;
  background:
    radial-gradient(900px 600px at 15% -10%,#F7D5E0 0%,transparent 55%),
    radial-gradient(800px 500px at 100% 100%,#F8DDE4 0%,transparent 60%),
    #FFF6FA;
  transform:translateX(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
.page::-webkit-scrollbar{display:none}
.page.on{transform:translateX(0)}
.pg-inner{max-width:420px;margin:0 auto;padding:0 16px 60px}
.pg-top{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:calc(env(safe-area-inset-top,20px) + 12px) 0 10px;
  position:sticky;top:0;z-index:3;
  background:linear-gradient(180deg,#FFF6FA 62%,rgba(255,246,250,0));
}
.pg-back{
  width:32px;height:32px;border-radius:50%;flex:0 0 auto;
  display:grid;place-items:center;cursor:pointer;
  background:rgba(255,253,254,.7);border:1px solid rgba(255,255,255,.8);
  box-shadow:0 2px 8px rgba(180,120,130,.12);
}
.pg-back svg{width:15px;height:15px;stroke:var(--rose-deep);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pg-ttl{font-family:var(--serif-cn);font-weight:600;font-size:15.5px;color:var(--t1);flex:1;text-align:center;letter-spacing:.5px}
.pg-sp{width:32px;flex:0 0 auto}

/* detail hero */
.d-hero{
  border-radius:var(--r-card);overflow:hidden;position:relative;
  aspect-ratio:16/9;background-size:cover;background-position:center;
  display:flex;align-items:flex-end;padding:16px 18px;
  box-shadow:0 8px 26px rgba(180,120,130,.2);
}
.d-hero::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(90,61,74,.48) 100%)}
.d-hero .in{position:relative;z-index:1}
.d-hero .line{font-family:var(--serif-en);font-style:italic;font-weight:600;font-size:17px;color:#fff;text-shadow:0 1px 8px rgba(90,61,74,.45)}
.d-hero .cat{font-size:10.5px;color:rgba(255,255,255,.86);letter-spacing:2px;margin-top:5px}
/* 换封面 —— 压在 hero 右上角的玻璃小胶囊 */
.d-cv{position:absolute;top:10px;right:10px;z-index:2;display:flex;gap:6px}
.d-cv button{
  padding:6px 12px;border-radius:var(--r-pill);cursor:pointer;
  border:1px solid rgba(255,255,255,.5);
  background:rgba(90,61,74,.34);
  backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);
  color:#fff;font-size:11.5px;font-family:var(--sans-cn);letter-spacing:.5px;
  box-shadow:0 2px 8px rgba(90,61,74,.22),inset 0 1px 0 rgba(255,255,255,.28);
}
.d-cv button:active{transform:scale(.96)}
.d-why{
  margin-top:14px;padding:14px 16px;border-radius:16px;
  background:var(--surface);border:1px solid rgba(255,255,255,.85);
  box-shadow:var(--shadow-card);
}
.d-why .lb{font-size:9.5px;color:var(--gold);letter-spacing:2px;font-weight:500}
.d-why .tx{font-family:var(--serif-cn);font-size:13.5px;line-height:1.85;color:var(--t1);margin-top:5px}
.d-stat{display:flex;gap:8px;margin-top:12px}
.d-stat .it{
  flex:1;text-align:center;padding:11px 6px;border-radius:14px;
  background:rgba(255,255,255,.6);border:.5px solid rgba(255,255,255,.85);
}
.d-stat .n{font-family:var(--serif-en);font-weight:600;font-size:19px;color:var(--rose-deep);line-height:1}
.d-stat .l{font-size:10px;color:var(--t3);letter-spacing:1px;margin-top:4px}

/* day-count stepper */
.stepper{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin-top:12px;padding:12px 14px;border-radius:16px;
  background:var(--surface);border:1px solid rgba(255,255,255,.85);
  box-shadow:var(--shadow-card);
}
.stepper .lb{font-size:12.5px;color:var(--t2);letter-spacing:.5px}
.stepper .lb small{display:block;font-size:10.5px;color:var(--t3);margin-top:3px;letter-spacing:0}
.st-ctl{display:flex;align-items:center;gap:12px;flex:0 0 auto}
.st-btn{
  width:30px;height:30px;border-radius:50%;cursor:pointer;
  display:grid;place-items:center;border:.5px solid rgba(212,165,176,.5);
  background:rgba(255,255,255,.7);
}
.st-btn svg{width:14px;height:14px;stroke:var(--rose-deep);stroke-width:2;fill:none;stroke-linecap:round}
.st-btn.off{opacity:.34;pointer-events:none}
.st-n{font-family:var(--serif-en);font-weight:600;font-size:20px;color:var(--t1);min-width:26px;text-align:center}
/* ===== Day blocks in detail ===== */
.dayblk{
  margin-top:12px;padding:14px 16px;border-radius:16px;
  background:var(--surface);border:1px solid rgba(255,255,255,.85);
  box-shadow:0 5px 18px rgba(180,120,130,.12),inset 0 1px 0 rgba(255,255,255,.9);
  position:relative;
}
.dayblk.cur{border-color:rgba(212,165,176,.75);box-shadow:0 0 0 1px rgba(212,165,176,.4),0 6px 22px rgba(180,120,130,.18)}
.db-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.db-d{display:flex;align-items:baseline;gap:8px}
.db-d .n{font-family:var(--serif-en);font-weight:600;font-size:17px;color:var(--rose-deep);letter-spacing:1px}
.db-d .dt{font-size:10.5px;color:var(--t3);letter-spacing:1px;font-family:var(--sans-en)}
.db-tag{
  font-size:9.5px;letter-spacing:1px;padding:3px 9px;border-radius:var(--r-pill);
  background:rgba(212,165,176,.16);color:var(--rose-deep);font-weight:500;
}
.db-tag.past{background:rgba(184,154,170,.14);color:var(--t3)}
.act{padding:11px 0 2px;position:relative;padding-left:15px}
.act + .act{border-top:.5px dashed rgba(212,165,176,.3)}
.act::before{
  content:'';position:absolute;left:0;top:14px;bottom:5px;width:2px;
  background:linear-gradient(180deg,var(--rose),transparent);border-radius:2px;opacity:.5;
}
.act-lb{
  font-family:var(--serif-cn);font-size:10.5px;color:var(--rose-deep);
  letter-spacing:1.5px;display:flex;align-items:center;justify-content:space-between;gap:8px;
}

/* ========== State ==========
   state: 'lib' 未开启 | 'playing' 正在演 | 'done' 演完了 | 'stopped' 不演了
   acts:  { 1:['第一幕文字','第二幕文字'], 2:[...] }  —— 每天幕数可以不一样 */
let uid = 0;
const SCRIPTS = PRESETS.map(p=>{
  const acts = {};
  p.acts.forEach((day,i)=>{ acts[i+1] = [...day]; });
  return {
    id:'s'+(++uid), name:p.name, cat:p.cat, grad:p.grad, cover:p.cover,
    line:p.line, why:p.why, days:p.acts.length, acts,
    state:'lib', startDate:null, preset:true
  };
});
const cats = [...CATS];

/* Demo：让「粘人小狗」和「财富自由」处于正在演，演到第 3 / 第 5 天 */
(function seed(){
  const a = SCRIPTS[0];
  a.state = 'playing'; a.startDate = shiftK(td(),-2);
  const b = SCRIPTS[2];
  b.state = 'playing'; b.startDate = shiftK(td(),-4); b.days = 21;
  for(let d=8;d<=21;d++) b.acts[d] = ['',''];
})();

/* ========== Cover helper ========== */
/* 有图用图，没图（或加载失败）用渐变兜底 —— 跟感恩页占位一个逻辑 */
function coverStyle(s){
  const grad = GRADS[s.grad] || GRADS.cv1;
  if(s.coverData) return `background-image:url(${s.coverData})`;
  if(s.cover) return `background-image:url(${s.cover}),${grad}`;
  return `background-image:${grad}`;
}
function esc(t){
  return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* ========== 7-day window ==========
   首页只露 7 天：按当前天所在的那一周切窗口，不用手滑（横滑留给换剧本） */
function weekWin(s){
  const n = curDay(s);
  const wi = Math.floor((n-1)/7);
  const from = wi*7 + 1;
  const to = Math.min(from+6, s.days);
  return {from, to, wi:wi+1, total:Math.ceil(s.days/7)};
}
function dotsHtml(s){
  const n = curDay(s);
  const w = weekWin(s);
  let h = '<div class="dots"><div class="dots-row">';
  for(let d=w.from; d<=w.to; d++){
    const cls = d < n ? 'done' : (d === n ? 'cur' : '');
    h += `<div class="dot ${cls}">${d}</div>`;
  }
  h += '</div></div>';
  if(w.total > 1) h += `<div class="dots-wk">第 ${w.wi} 周 · 共 ${w.total} 周</div>`;
  return h;
}

function renderNP(){
  const host = document.getElementById('npHost');
  const ind = document.getElementById('npInd');
  const cnt = document.getElementById('npCount');
  const list = SCRIPTS.filter(s=>s.state==='playing');
  cnt.textContent = list.length ? list.length + ' 部' : '';
  ind.innerHTML = '';
  if(!list.length){
    host.innerHTML = '<div class="np-empty"><span class="en">Nothing playing.</span><span class="cn">还没开始任何剧本<br>从下面挑一部，或者自己写一部</span></div>';
    return;
  }
  const wrap = document.createElement('div');
  wrap.className = 'np-wrap';
  wrap.id = 'npWrap';
  list.forEach(s=>{
    const n = curDay(s);
    const acts = s.acts[n] || [];
    let sceneHtml = '';
    acts.slice(0,NP_ACT_MAX).forEach((t,i)=>{
      const empty = !t || !t.trim();
      sceneHtml += `<div class="np-scene">
        <span class="lead">Act ${i+1}<span class="cn">第 ${i+1} 幕</span></span>
        <div class="txt${empty?' empty':''}">${empty?'这一幕还没写 · 点进去写':esc(t)}</div>
      </div>`;
    });
    if(!acts.length){
      sceneHtml = `<div class="np-scene">
        <span class="lead">Act 1<span class="cn">第 1 幕</span></span>
        <div class="txt empty">今天还没有幕 · 点进去加一幕</div>
      </div>`;
    }
    const extra = Math.max(acts.length - NP_ACT_MAX, 0);
    const moreHtml = extra > 0
      ? `<div class="np-more"><span>还有 ${extra} 幕</span><svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M12.5 6.5 19 12l-6.5 5.5"/></svg></div>`
      : '';
    const card = document.createElement('div');
    card.className = 'np-card';
    card.innerHTML = `
      <div class="np-head">
        <div>
          <div class="np-name">${esc(s.name)}</div>
          <div class="np-cat">${esc(s.cat)} · 共 ${s.days} 天</div>
        </div>
        <div class="np-day">DAY ${n} / ${s.days}</div>
      </div>
      ${dotsHtml(s)}
      <div class="np-scenes">${sceneHtml}${moreHtml}</div>
    `;
    card.addEventListener('click',()=>openDetail(s.id));
    wrap.appendChild(card);
    const i = document.createElement('i');
    ind.appendChild(i);
  });
  host.innerHTML = '';
  host.appendChild(wrap);
  if(list.length > 1){
    const dots = [...ind.children];
    dots[0].classList.add('on');
    wrap.addEventListener('scroll',()=>{
      const i = Math.round(wrap.scrollLeft / wrap.clientWidth);
      dots.forEach((d,j)=>d.classList.toggle('on', j===i));
    });
  } else {
    ind.innerHTML = '';
  }
}
/* ========== Render: chips ========== */
function renderChips(){
  const host = document.getElementById('chips');
  host.innerHTML = '';
  const archN = SCRIPTS.filter(s=>s.state==='done'||s.state==='stopped').length;
  /* 「全部」「演过的」「+ 新分类」钉死不参与排序，中间的分类才能挪 */
  const mk = (label, val, cls)=>{
    const el = document.createElement('div');
    el.className = 'chip' + (cls?' '+cls:'') + (filter===val?' on':'');
    el.textContent = label;
    el.addEventListener('click',()=>{
      if(el.dataset.moved){ delete el.dataset.moved; return; }  /* 刚拖完的那一下不算点击 */
      filter = val; renderChips(); renderGrid();
    });
    host.appendChild(el);
    return el;
  };
  mk('全部','全部','fixed');
  cats.forEach((c,i)=>{
    const el = mk(c,c);
    el.dataset.cat = i;
    bindChipDrag(el, host);
  });
  if(archN) mk('演过的 · ' + archN,'演过的','fixed');
  const add = document.createElement('div');
  add.className = 'chip add fixed';
  add.textContent = '+ 新分类';
  add.addEventListener('click',openCatSheet);
  host.appendChild(add);
}

/* 长按胶囊 → 左右拖着挪顺序 */
function bindChipDrag(el, host){
  let timer = null, dragging = false, sx = 0;
  const start = (x)=>{
    dragging = true; sx = x;
    host.classList.add('sorting');
    el.classList.add('drag');
    if(navigator.vibrate) navigator.vibrate(12);
  };
  const move = (x)=>{
    el.style.transform = `translateX(${x-sx}px) scale(1.08)`;
    /* 拖动的胶囊中心越过隔壁中心 → 直接把自己插到隔壁那一侧，DOM 顺序就是新顺序 */
    const me = el.getBoundingClientRect();
    const mid = me.left + me.width/2;
    for(const o of [...host.querySelectorAll('.chip[data-cat]')]){
      if(o===el) continue;
      const r = o.getBoundingClientRect();
      const oc = r.left + r.width/2;
      const oAfter = !!(el.compareDocumentPosition(o) & Node.DOCUMENT_POSITION_FOLLOWING);
      let moved = false;
      if(!oAfter && mid < oc){ host.insertBefore(el, o); moved = true; }          /* 往左越过前面那个 */
      else if(oAfter && mid > oc){ host.insertBefore(el, o.nextSibling); moved = true; }  /* 往右越过后面那个 */
      if(moved){
        /* 位置换了，基准跟着挪，手指底下不跳 */
        sx = x;
        el.style.transform = 'translateX(0) scale(1.08)';
        break;
      }
    }
  };
  const end = ()=>{
    clearTimeout(timer);
    if(!dragging) return;
    dragging = false;
    el.style.transform = '';
    el.classList.remove('drag');
    host.classList.remove('sorting');
    el.dataset.moved = '1';
    /* DOM 顺序回写进 cats */
    cats.length = 0;
    host.querySelectorAll('.chip[data-cat]').forEach(n=>cats.push(n.textContent));
    renderChips(); renderGrid();
    showToast('顺序改好了');
  };
  el.addEventListener('touchstart',e=>{
    const x = e.touches[0].clientX;
    timer = setTimeout(()=>start(x),420);
  },{passive:true});
  el.addEventListener('touchmove',e=>{
    if(!dragging){ clearTimeout(timer); return; }
    e.preventDefault();
    move(e.touches[0].clientX);
  },{passive:false});
  el.addEventListener('touchend',end);
  el.addEventListener('touchcancel',end);
  /* 桌面上也能试 */
  el.addEventListener('mousedown',e=>{
    const x = e.clientX;
    timer = setTimeout(()=>{
      start(x);
      const mm = ev=>move(ev.clientX);
      const mu = ()=>{ document.removeEventListener('mousemove',mm); document.removeEventListener('mouseup',mu); end(); };
      document.addEventListener('mousemove',mm);
      document.addEventListener('mouseup',mu);
    },420);
  });
  el.addEventListener('mouseup',()=>clearTimeout(timer));
  el.addEventListener('mouseleave',()=>clearTimeout(timer));
}

/* ========== Render: library grid ========== */
function renderGrid(){
  const host = document.getElementById('grid');
  const cnt = document.getElementById('libCount');
  host.innerHTML = '';
  const arch = filter === '演过的';
  let list = SCRIPTS.filter(s=>{
    if(arch) return s.state==='done' || s.state==='stopped';
    if(s.state==='done' || s.state==='stopped') return false;
    return filter==='全部' ? true : s.cat===filter;
  });
  cnt.textContent = list.length + ' 部';

  /* 归档区不放「自己写一部」，其他分类下第一张就是新建卡 */
  if(!arch){
    const nw = document.createElement('div');
    nw.className = 'sc new';
    const tt = filter==='全部' ? '自己写一部' : `在${filter}里写一部`;
    nw.innerHTML = `
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      <div class="tt">${esc(tt)}</div>
    `;
    nw.addEventListener('click',()=>openNewSheet(filter==='全部'?null:filter));
    host.appendChild(nw);
  }

  if(!list.length && arch){
    host.innerHTML = '<div class="grid-empty">还没有演过的剧本<br>演完或者停掉的会收在这里</div>';
    return;
  }
  list.forEach(s=>{
    const card = document.createElement('div');
    card.className = 'sc' + (arch ? ' arch' : '');
    let badge = '';
    if(s.state==='playing') badge = `<div class="sc-badge">DAY ${curDay(s)} / ${s.days}</div>`;
    else if(s.state==='done') badge = '<div class="sc-badge">已完成</div>';
    else if(s.state==='stopped') badge = '<div class="sc-badge">已停止</div>';
    const w = writtenCount(s), a = actCount(s);
    const btns = arch
      ? `<button class="sc-btn ghost" data-act="del">删除</button><button class="sc-btn fill" data-act="again">再演一轮</button>`
      : (s.state==='playing'
        ? `<button class="sc-btn fill" data-act="open" style="flex:1">进去演</button>`
        : `<button class="sc-btn ghost" data-act="open">详情</button><button class="sc-btn fill" data-act="start">开启</button>`);
    card.innerHTML = `
      <div class="sc-cover ${s.grad}" style="${coverStyle(s)}">
        ${badge}
        <div class="line">${esc(s.line||'')}</div>
      </div>
      <div class="sc-body">
        <div class="sc-name">${esc(s.name)}</div>
        <div class="sc-why">
          <div class="lb">简介</div>
          <div class="tx">${esc(s.why||'自己写的剧本，自己最清楚为什么')}</div>
        </div>
        <div class="sc-meta">${s.days} 天 · ${a} 幕${a?` · 已写 ${w}`:''}</div>
        <div class="sc-ops">${btns}</div>
      </div>
    `;
    card.querySelector('.sc-cover').addEventListener('click',()=>openDetail(s.id));
    card.querySelector('.sc-name').addEventListener('click',()=>openDetail(s.id));
    card.querySelectorAll('[data-act]').forEach(b=>{
      b.addEventListener('click',ev=>{
        ev.stopPropagation();
        const a = b.dataset.act;
        if(a==='open') openDetail(s.id);
        else if(a==='start') startScript(s.id);
        else if(a==='again') playAgain(s.id);
        else if(a==='del') deleteScript(s.id);
      });
    });
    host.appendChild(card);
  });
}

}
function closeDetail(){ detail.classList.remove('on'); curId = null; }
document.getElementById('dBack').addEventListener('click',closeDetail);

function renderDetail(){
  const s = SCRIPTS.find(x=>x.id===curId);
  if(!s) return;
  document.getElementById('dTtl').textContent = s.name;
  const body = document.getElementById('dBody');
  const playing = s.state==='playing';
  const n = playing ? curDay(s) : 0;
  const arch = s.state==='done' || s.state==='stopped';

  let h = `
    <div class="d-hero ${s.grad}" style="${coverStyle(s)}">
      <div class="d-cv">
        <button data-cv="pick">换封面</button>
        ${s.coverData?'<button data-cv="drop">移除</button>':''}
      </div>
      <div class="in">
        <div class="line">${esc(s.line||'')}</div>
        <div class="cat">${esc(s.cat)}${playing?` · DAY ${n} / ${s.days}`:''}${arch?(s.state==='done'?' · 已完成':' · 已停止'):''}</div>
      </div>
    </div>
    <div class="d-why">
      <div class="lb">简介</div>
      <div class="tx">${esc(s.why||'这部是我自己写的。')}</div>
    </div>
    <div class="d-stat">
      <div class="it"><div class="n">${s.days}</div><div class="l">天</div></div>
      <div class="it"><div class="n">${actCount(s)}</div><div class="l">幕</div></div>
      <div class="it"><div class="n">${writtenCount(s)}</div><div class="l">已写</div></div>
    </div>
  `;

  /* 天数步进器：已经演过的天不能删 */
  const floor = playing ? Math.max(n,1) : 1;
  h += `
    <div class="stepper">
      <div class="lb">天数</div>
      <div class="st-ctl">
        <div class="st-btn ${s.days<=floor?'off':''}" id="dMinus"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></div>
        <div class="st-n">${s.days}</div>
        <div class="st-btn ${s.days>=DAYS_MAX?'off':''}" id="dPlus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></div>
      </div>
    </div>
  `;

  if(overrun(s)){
    h += `<div class="d-why" style="border-color:rgba(201,168,122,.5)">
      <div class="lb">走完一轮了</div>
      <div class="tx">${s.days} 天都过去了。可以「演完了」收进演过的，也可以「再演一轮」从 DAY 1 重新开始。</div>
    </div>`;
  }

  /* 逐天列出 */
  for(let d=1; d<=s.days; d++){
    const acts = s.acts[d] || [];
    const isCur = playing && d===n;
    let tag = '';
    if(playing){
      if(d<n) tag = '<div class="db-tag past">已过去</div>';
      else if(d===n) tag = '<div class="db-tag">今天</div>';
    }
    h += `<div class="dayblk${isCur?' cur':''}">
      <div class="db-head">
        <div class="db-d"><span class="n">DAY ${d}</span><span class="dt">${dateLabel(s,d)}</span></div>
        ${tag}
      </div>`;
    if(!acts.length){
      h += `<div class="act">
        <div class="act-lb"><span>第 1 幕</span></div>
        <div class="act-tx empty" data-w="${d}" data-i="0">这天还没有幕 · 点这里写</div>
      </div>`;
    }
    acts.forEach((t,i)=>{
      const empty = !t || !t.trim();
      h += `<div class="act">
        <div class="act-lb">
          <span>第 ${i+1} 幕</span>
          ${acts.length>1?`<span class="del" data-dw="${d}" data-di="${i}">删除</span>`:''}
        </div>
        <div class="act-tx${empty?' empty':''}" data-w="${d}" data-i="${i}">${empty?'这一幕还没写 · 点这里写':esc(t)}</div>
      </div>`;
    });
    h += `<div class="act-add" data-add="${d}">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>给 DAY ${d} 加一幕</span>
    </div></div>`;
  }

  /* 底部动作 */
  h += '<div class="d-ops">';
  if(s.state==='lib'){
    h += `<button class="d-op fill" data-do="start">开启这部剧本</button>`;
  } else if(playing){
    h += `<button class="d-op fill" data-do="finish">演完了</button>
          <button class="d-op ghost" data-do="again">再演一轮</button>
          <button class="d-op warn" data-do="stop">不演了</button>`;
  } else {
    h += `<button class="d-op fill" data-do="again">再演一轮</button>
          <button class="d-op warn" data-do="del">彻底删除</button>`;
  }
  h += '</div><div style="height:20px"></div>';
  body.innerHTML = h;
  bindDetail(s);
}
function bindDetail(s){
  const body = document.getElementById('dBody');
  /* 点幕 → 写 */
  body.querySelectorAll('[data-w]').forEach(el=>{
    el.addEventListener('click',()=>{
      const d = +el.dataset.w, i = +el.dataset.i;
      if(!s.acts[d]) s.acts[d] = [];
      if(s.acts[d].length <= i) s.acts[d][i] = '';
      openActSheet(s.id, d, i);
    });
  });
  /* 删幕 */
  body.querySelectorAll('[data-dw]').forEach(el=>{
    el.addEventListener('click',ev=>{
      ev.stopPropagation();
      const d = +el.dataset.dw, i = +el.dataset.di;
      const t = (s.acts[d]||[])[i];
      const kill = ()=>{
        s.acts[d].splice(i,1);
        renderDetail(); renderAll(); showToast('已删除这一幕');
      };
      if(t && t.trim()) ask(`DAY ${d} 第 ${i+1} 幕写了内容，删掉找不回来。`, kill);
      else kill();
    });
  });
  /* 加幕 */
  body.querySelectorAll('[data-add]').forEach(el=>{
    el.addEventListener('click',()=>{
      const d = +el.dataset.add;
      if(!s.acts[d]) s.acts[d] = [];
      s.acts[d].push('');
      const i = s.acts[d].length - 1;
      renderDetail(); renderAll();
      openActSheet(s.id, d, i);
    });
  });
  /* 天数增减 */
  const minus = document.getElementById('dMinus');
  const plus = document.getElementById('dPlus');
  if(plus) plus.addEventListener('click',()=>{
    if(s.days >= DAYS_MAX) return;
    s.days++;
    if(!s.acts[s.days]) s.acts[s.days] = [''];
    renderDetail(); renderAll(); showToast(`加到 ${s.days} 天 · DAY ${s.days} 的幕等你写`);
  });
  if(minus) minus.addEventListener('click',()=>{
    const floor = s.state==='playing' ? Math.max(curDay(s),1) : 1;
    if(s.days <= floor){
      showToast(s.state==='playing' ? `已经演到 DAY ${floor} 了，演过的天删不掉` : '最少 1 天');
      return;
    }
    const d = s.days;
    const w = (s.acts[d]||[]).filter(t=>t&&t.trim()).length;
    const kill = ()=>{
      delete s.acts[d];
      s.days--;
      renderDetail(); renderAll(); showToast(`减到 ${s.days} 天`);
    };
    if(w) ask(`DAY ${d} 已经写了 ${w} 幕，删掉就找不回来了。`, kill);
    else kill();
  });
  /* 换封面 / 移除封面 */
  body.querySelectorAll('[data-cv]').forEach(b=>{
    b.addEventListener('click',()=>{
      if(b.dataset.cv==='pick'){ pickCover(s.id); return; }
      ask('把封面换回原来的渐变？',()=>{
        s.coverData = null;
        renderDetail(); renderAll(); showToast('封面已移除');
      });
    });
  });
  /* 底部动作 */
  body.querySelectorAll('[data-do]').forEach(b=>{
    b.addEventListener('click',()=>{
      const a = b.dataset.do;
      if(a==='start'){ startScript(s.id); renderDetail(); }
      else if(a==='finish'){ s.state='done'; s.startDate=null; closeDetail(); renderAll(); showToast('已收进「演过的」'); }
      else if(a==='stop'){
        ask('不演了？进度会停在这里，剧本收进「演过的」。',()=>{
          s.state='stopped'; s.startDate=null; closeDetail(); renderAll(); showToast('已停止');
        });
      }
      else if(a==='again'){ playAgain(s.id); renderDetail(); }
      else if(a==='del'){ deleteScript(s.id, closeDetail); }
    });
  });
}

/* ========== Script actions ========== */
function startScript(id){
  const s = SCRIPTS.find(x=>x.id===id);
  s.state = 'playing';
  s.startDate = td();
  renderAll();
  showToast(`${s.name} 开始了 · 今天是 DAY 1`);
}
function playAgain(id){
  const s = SCRIPTS.find(x=>x.id===id);
  s.state = 'playing';
  s.startDate = td();
  renderAll();
  showToast('从 DAY 1 重新开始 · 你写的幕都留着');
}
function deleteScript(id, after){
  const s = SCRIPTS.find(x=>x.id===id);
  const a = actCount(s);
  ask(`彻底删除《${s.name}》？这部的 ${a} 幕会一起消失，找不回来。`,()=>{
    SCRIPTS.splice(SCRIPTS.indexOf(s),1);
    renderAll(); showToast('已删除');
    if(after) after();
  });
}
/* ========== Confirm ==========
   自己画的确认框。系统 confirm 在 file:// 下被"阻止此页面弹出对话框"勾掉一次之后
   就永远返回 false —— 按钮看着能点、点了什么都不发生，跟坏了一样。 */
const cfm = document.getElementById('cfm');
let cfmCb = null;
function ask(text, onYes){
  document.getElementById('cfmTx').textContent = text;
  cfmCb = onYes;
  cfm.classList.add('on');
}
function cfmClose(){ cfm.classList.remove('on'); cfmCb = null; }
document.getElementById('cfmNo').addEventListener('click',cfmClose);
document.getElementById('cfmBd').addEventListener('click',cfmClose);
document.getElementById('cfmYes').addEventListener('click',()=>{
  const cb = cfmCb; cfmClose(); if(cb) cb();
});

/* ========== Sheets ========== */
const mask = document.getElementById('mask');
const actSheet = document.getElementById('actSheet');
const newSheet = document.getElementById('newSheet');
const catSheet = document.getElementById('catSheet');
const asTa = document.getElementById('asTa');

function openSheet(el){ mask.classList.add('on'); el.classList.add('on'); }
function closeSheets(){
  mask.classList.remove('on');
  [actSheet,newSheet,catSheet].forEach(s=>s.classList.remove('on'));
  actCtx = null;
}
mask.addEventListener('click',closeSheets);
document.getElementById('asCancel').addEventListener('click',closeSheets);
document.getElementById('nsCancel').addEventListener('click',closeSheets);
document.getElementById('csCancel').addEventListener('click',closeSheets);

/* --- write one act --- */
function openActSheet(sid, day, idx){
  const s = SCRIPTS.find(x=>x.id===sid);
  actCtx = {sid, day, idx};
  document.getElementById('asTtl').textContent = `DAY ${day} · 第 ${idx+1} 幕`;
  document.getElementById('asSub').textContent = `${s.name} · ${dateLabel(s,day)||'还没开启'}`;
  asTa.value = (s.acts[day]||[])[idx] || '';
  /* 顺手把前一幕给你看着，接得上 */
  const prev = document.getElementById('asPrev');
  let pt = '';
  if(idx > 0) pt = (s.acts[day]||[])[idx-1];
  else if(day > 1){ const pa = s.acts[day-1]||[]; pt = pa[pa.length-1]; }
  if(pt && pt.trim()){
    prev.innerHTML = `<div class="sh-prev"><div class="lb">${idx>0?'上一幕':`DAY ${day-1} 最后一幕`}</div><div class="tx">${esc(pt)}</div></div>`;
  } else prev.innerHTML = '';
  openSheet(actSheet);
  setTimeout(()=>asTa.focus(),340);
}
document.getElementById('asOk').addEventListener('click',()=>{
  if(!actCtx) return;
  const {sid,day,idx} = actCtx;
  const s = SCRIPTS.find(x=>x.id===sid);
  if(!s.acts[day]) s.acts[day] = [];
  while(s.acts[day].length <= idx) s.acts[day].push('');
  s.acts[day][idx] = asTa.value.trim();
  closeSheets();
  if(curId) renderDetail();
  renderAll();
  showToast('已保存');
});

/* --- create a script --- */
function openNewSheet(presetCat){
  newCover = null;
  newCat = presetCat || cats[0];
  newDays = 7;
  document.getElementById('nsName').value = '';
  document.getElementById('nsWhy').value = '';
  document.getElementById('nsDays').textContent = newDays;
  const cv = document.getElementById('nsCv');
  cv.className = 'cv-slot add';
  cv.style.backgroundImage = '';
  cv.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
  renderNsCats();
  openSheet(newSheet);
  setTimeout(()=>document.getElementById('nsName').focus(),340);
}
function renderNsCats(){
  const host = document.getElementById('nsCats');
  host.innerHTML = '';
  cats.forEach(c=>{
    const el = document.createElement('div');
    el.className = 'sh-chip' + (newCat===c?' on':'');
    el.textContent = c;
    el.addEventListener('click',()=>{ newCat = c; renderNsCats(); });
    host.appendChild(el);
  });
}
document.getElementById('nsPlus').addEventListener('click',()=>{
  if(newDays >= DAYS_MAX) return;
  newDays++; document.getElementById('nsDays').textContent = newDays;
});
document.getElementById('nsMinus').addEventListener('click',()=>{
  if(newDays <= DAYS_MIN) return;
  newDays--; document.getElementById('nsDays').textContent = newDays;
});
const cvInput = document.getElementById('cvInput');
/* 同一个 file input 两处用：null = 新建抽屉里那格，有 id = 给已有的剧本换封面 */
let cvTarget = null;
function pickCover(id){ cvTarget = id; cvInput.click(); }
document.getElementById('nsCv').addEventListener('click',()=>{
  cvTarget = null;
  cvInput.click();
});
cvInput.addEventListener('change',e=>{
  const f = (e.target.files||[])[0];
  const tgt = cvTarget;
  cvTarget = null;
  cvInput.value = '';
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    if(tgt){
      const s = SCRIPTS.find(x=>x.id===tgt);
      if(!s) return;
      s.coverData = ev.target.result;
      renderDetail(); renderAll(); showToast('封面换好了');
      return;
    }
    newCover = ev.target.result;
    const cv = document.getElementById('nsCv');
    cv.className = 'cv-slot';
    cv.style.backgroundImage = `url(${newCover})`;
    cv.innerHTML = '<div class="del">×</div>';
    cv.querySelector('.del').addEventListener('click',ev2=>{
      ev2.stopPropagation();
      newCover = null;
      cv.className = 'cv-slot add';
      cv.style.backgroundImage = '';
      cv.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>';
    });
  };
  r.readAsDataURL(f);
});
document.getElementById('nsOk').addEventListener('click',()=>{
  const name = document.getElementById('nsName').value.trim();
  if(!name){ showToast('先给剧本起个名字'); return; }
  const why = document.getElementById('nsWhy').value.trim();
  const acts = {};
  for(let d=1; d<=newDays; d++) acts[d] = [''];
  const gk = 'cv' + (1 + (SCRIPTS.length % 8));
  const s = {
    id:'s'+(++uid), name, cat:newCat, grad:gk, cover:null, coverData:newCover,
    line:'', why, days:newDays, acts, state:'lib', startDate:null, preset:false
  };
  SCRIPTS.unshift(s);
  closeSheets();
  filter = newCat;
  renderAll();
  openDetail(s.id);
  showToast('建好了 · 幕可以每天回来写');
});

/* --- new category --- */
function openCatSheet(){
  document.getElementById('csName').value = '';
  openSheet(catSheet);
  setTimeout(()=>document.getElementById('csName').focus(),340);
}
document.getElementById('csOk').addEventListener('click',addCat);
document.getElementById('csName').addEventListener('keydown',e=>{
  if(e.key==='Enter'){ e.preventDefault(); addCat(); }
});
function addCat(){
  const v = document.getElementById('csName').value.trim();
  if(!v){ showToast('写个分类名'); return; }
  if(cats.includes(v)){ showToast('已经有这个分类了'); closeSheets(); filter=v; renderAll(); return; }
  cats.push(v);
  closeSheets();
  filter = v;
  renderAll();
  showToast(`分类「${v}」建好了`);
}

/* ========== Toast ========== */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('on'), 1900);
}

/* ========== Init ========== */
renderAll();
document.addEventListener('keydown',e=>{
  if(e.key !== 'Escape') return;
  if(actSheet.classList.contains('on') || newSheet.classList.contains('on') || catSheet.classList.contains('on')) closeSheets();
  else if(detail.classList.contains('on')) closeDetail();
});
</script>
<script>
/* PWA —— 装到桌面用。file:// 下不注册（协议不支持），只在 http/https 生效 */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
