<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FFF3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reverie">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>肯定语 · Reverie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg-image:none;
  --bg-gradient:
    radial-gradient(1200px 800px at 15% -10%,#F5CDDB 0%,transparent 55%),
    radial-gradient(1000px 700px at 100% 100%,#F6D5DE 0%,transparent 60%),
    #FFF3F7;
  --surface:rgba(255,253,254,.88);
  --surface-solid:#FFFCFD;
  --pearl:#F1E3E8;
  --rose:#D4A5B0;
  --rose-deep:#A87682;
  --rose-soft:#E9C4CD;
  --gold:#C9A87A;
  --t1:#5A3D4A;
  --t2:#8B6B7A;
  --t3:#B89AAA;
  --serif-en:'Cormorant Garamond',serif;
  --sans-en:'Inter',-apple-system,sans-serif;
  --serif-cn:'Noto Serif SC',serif;
  --sans-cn:-apple-system,'PingFang SC',sans-serif;
  --r-card:20px;
  --r-pill:999px;
  --shadow-card:0 6px 24px rgba(180,120,130,.14),inset 0 1px 0 rgba(255,255,255,.9);
}
/* Cormorant 老式数字会把 1 写成小写 i —— 数字位强制 lining figures */
.center-idle .big,.center-running .big,.center-running .small,.stat-line,.stat-line *,.dur .d{
  font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1,"onum" 0;
}
html{height:100%}
body{
  font-family:var(--sans-cn);color:var(--t1);font-size:15px;
  background-color:#FFF3F7;
  background-image:var(--bg-image),var(--bg-gradient);
  background-size:cover;background-position:center;
  background-attachment:fixed;background-repeat:no-repeat;
  min-height:100%;overflow-x:hidden;
  /* 底 tabbar 是 fixed 的，首页那个球还往上凸 22px —— 留够，别让内容被压在底下 */
  padding-bottom:calc(118px + env(safe-area-inset-bottom));
}
.phone{max-width:420px;margin:0 auto;position:relative;padding:0 14px;padding-top:calc(env(safe-area-inset-top,20px) + 8px)}

/* ===== Top tabs ===== */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-pill{
  flex-shrink:0;padding:8px 14px;border-radius:var(--r-pill);
  background:rgba(255,253,254,.6);
  backdrop-filter:blur(20px) saturate(180%);
  -webkit-backdrop-filter:blur(20px) saturate(180%);
  border:1px solid rgba(255,255,255,.7);
  font-size:12.5px;color:var(--t2);font-weight:500;letter-spacing:.5px;
  cursor:pointer;transition:all .2s;font-family:var(--sans-cn);
}
.tab-pill.on{
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  color:#fff;border-color:transparent;
  box-shadow:0 4px 12px rgba(168,118,130,.28);
}
.tab-pill.add-tab{color:var(--rose-deep);font-weight:600;padding:8px 12px}

/* ===== Stats line ===== */
.stat-line{
  display:none;padding:4px 6px 8px;font-size:11.5px;color:var(--rose-deep);
  letter-spacing:.5px;align-items:center;gap:8px;
}
.stat-line.show{display:flex}
.stat-line .dot{width:3px;height:3px;background:var(--rose);border-radius:50%;flex-shrink:0}

/* ===== Vision board ===== */
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:2px 2px 12px}
.tile{
  aspect-ratio:1;border-radius:12px;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,.7);
  box-shadow:0 4px 12px rgba(180,120,130,.10),inset 0 1px 0 rgba(255,255,255,.6);
  cursor:pointer;background-size:cover;background-position:center;
}
.tile.g1{background:linear-gradient(135deg,#F4C2CE 0%,#E89AAF 100%)}
.tile.g2{background:linear-gradient(135deg,#F8D9C4 0%,#EBB597 100%)}
.tile.g3{background:linear-gradient(135deg,#E4C4F0 0%,#C89AD9 100%)}
.tile.g4{background:linear-gradient(135deg,#F5D0B8 0%,#E9A8D2 100%)}
.tile.g5{background:linear-gradient(135deg,#D9C8F0 0%,#B89AE0 100%)}
.tile.g6{background:linear-gradient(135deg,#FCE0E9 0%,#F5B8CA 100%)}
.tile::after{content:'';position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.35),transparent 60%)}
.tile.empty{background:rgba(255,255,255,.35);border:1.2px dashed rgba(212,165,176,.5);display:grid;place-items:center}
.tile.empty::after{display:none}
.tile.empty svg{width:22px;height:22px;stroke:var(--t3);stroke-width:1.5;fill:none}
.tile-del{
  position:absolute;top:4px;right:4px;z-index:2;
  width:22px;height:22px;border-radius:50%;
  background:rgba(90,61,74,.6);color:#fff;
  display:none;place-items:center;font-size:14px;line-height:1;cursor:pointer;
  backdrop-filter:blur(6px);
}
.tile.has-img:hover .tile-del,.tile.editing .tile-del{display:grid}
/* Sheet: image action sheet */
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:82;
  background:rgba(255,251,253,.96);
  backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.9);
  border-radius:24px 24px 0 0;
  padding:16px 18px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -12px 40px rgba(160,100,110,.22);
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
.sheet.on{transform:translateY(0)}
.sheet .st{font-family:var(--serif-cn);font-size:14px;color:var(--t2);text-align:center;padding:6px 0 14px}
.sheet .op{
  display:flex;align-items:center;gap:12px;
  padding:14px 4px;border-top:.5px solid var(--pearl);
  font-size:14.5px;font-family:var(--serif-cn);color:var(--t1);cursor:pointer;
}
.sheet .op:first-of-type{border-top:none}
.sheet .op svg{width:20px;height:20px;stroke:var(--rose-deep);stroke-width:1.6;fill:none;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.sheet .op.danger{color:var(--rose-deep)}
.sheet .op.danger svg{stroke:var(--rose-deep)}
.sheet .cancel-op{
  margin-top:10px;padding:14px 0;text-align:center;
  border-radius:14px;background:rgba(212,165,176,.14);
  font-size:14px;color:var(--t2);cursor:pointer;
}

/* ===== Checklist card ===== */
.list-card{
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:16px;padding:12px 14px 8px;
  box-shadow:0 6px 20px rgba(180,120,130,.12),inset 0 1px 0 rgba(255,255,255,.9);
  margin-bottom:10px;
}
.list-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:.5px dashed var(--pearl)}
.list-head .l{font-family:var(--serif-cn);font-size:13.5px;color:var(--t1);font-weight:600}
.list-head .l .n{color:var(--rose-deep);margin-left:4px;font-weight:500}
.add-btn{
  display:inline-flex;align-items:center;gap:4px;
  padding:5px 11px;border-radius:var(--r-pill);
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));
  color:#fff;font-size:11px;font-weight:500;letter-spacing:.5px;
  border:none;cursor:pointer;
  box-shadow:0 3px 8px rgba(168,118,130,.28),inset 0 1px 0 rgba(255,255,255,.3);
  font-family:var(--sans-cn);
}
.add-btn svg{width:11px;height:11px;stroke-width:2.2;stroke:currentColor;fill:none;stroke-linecap:round}
.list-body{max-height:180px;overflow-y:auto;scrollbar-width:none}
.list-body::-webkit-scrollbar{display:none}
.line{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:.5px solid var(--pearl);font-size:13px;color:var(--t1)}
.line:first-child{border-top:none}
.line .txt{flex:1;font-family:var(--serif-cn);line-height:1.5}
.line .tag{font-size:10px;color:var(--rose-deep);padding:1.5px 6px;border-radius:5px;background:rgba(212,165,176,.14);letter-spacing:.5px}
.line .x{color:var(--t3);font-size:16px;padding:0 4px;cursor:pointer}
.line-empty{padding:14px 0 10px;text-align:center;font-family:var(--serif-cn);font-size:12px;color:var(--t3)}

/* ===== Clock card ===== */
.clock-card{
  position:relative;
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-card);padding:18px 14px 14px;
  box-shadow:var(--shadow-card);text-align:center;
}
.clock-wrap{width:150px;height:150px;margin:0 auto;position:relative;cursor:pointer;user-select:none}
.halo{
  position:absolute;inset:-14px;border-radius:50%;
  background:radial-gradient(circle,rgba(212,165,176,.4) 0%,rgba(212,165,176,0) 68%);
  opacity:0;pointer-events:none;
}
.clock-wrap.running .halo{opacity:1;animation:breathe 3.6s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.55}50%{transform:scale(1.06);opacity:.9}}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring-svg .track{fill:none;stroke:rgba(212,165,176,.22);stroke-width:2.2}
.ring-svg .prog{fill:none;stroke:url(#gradRose);stroke-width:2.5;stroke-linecap:round;transition:stroke-dashoffset .8s linear}
.clock-wrap.countup .ring-svg .prog{stroke:rgba(212,165,176,.7);stroke-dasharray:none !important;stroke-dashoffset:0 !important;animation:softpulse 3.6s ease-in-out infinite}
@keyframes softpulse{0%,100%{opacity:.5}50%{opacity:.95}}
.clock-center{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}
.center-idle .big{font-family:var(--serif-en);font-style:italic;font-weight:600;font-size:42px;color:var(--rose-deep);letter-spacing:1px;line-height:1}
.center-idle .sub{font-family:var(--serif-cn);font-size:11px;color:var(--t2);letter-spacing:3px;margin-top:6px}
.center-running .big{font-family:var(--serif-en);font-weight:600;font-size:34px;color:var(--t1);letter-spacing:1px;line-height:1;font-feature-settings:"tnum" 1}
.center-running .sub{font-family:var(--serif-cn);font-size:11px;color:var(--rose-deep);letter-spacing:2.5px;margin-top:6px}

/* Duration pills */
.dur{display:flex;gap:5px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.dur .d{
  padding:5px 12px;border-radius:var(--r-pill);
  font-size:11.5px;color:var(--t2);letter-spacing:.5px;
  border:.5px solid rgba(212,165,176,.35);background:rgba(255,255,255,.5);
  font-family:var(--sans-cn);cursor:pointer;transition:all .2s;
}
.dur .d.on{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;border-color:transparent;font-weight:600;box-shadow:0 2px 6px rgba(168,118,130,.28)}
.dur .d.disabled{opacity:.4;pointer-events:none}

/* ===== Mask + Drawer ===== */
.mask{position:fixed;inset:0;background:rgba(90,61,74,.32);backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
.mask.on{opacity:1;pointer-events:auto}
.drawer{
  position:fixed;left:0;right:0;bottom:0;z-index:81;
  max-height:80vh;overflow-y:auto;
  background:rgba(255,251,253,.94);
  backdrop-filter:blur(30px) saturate(180%);
  -webkit-backdrop-filter:blur(30px) saturate(180%);
  border-top:1px solid rgba(255,255,255,.9);
  border-radius:28px 28px 0 0;
  box-shadow:0 -12px 40px rgba(160,100,110,.22);
  padding:14px 18px 30px;
  transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);
}
.drawer.on{transform:translateY(0)}
.grabber{width:36px;height:4px;border-radius:2px;background:var(--pearl);margin:0 auto 12px}
.dr-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.dr-head .t{font-family:var(--serif-en);font-style:italic;font-size:20px;color:var(--t1)}
.dr-head .t .cn{font-family:var(--serif-cn);font-style:normal;font-size:12px;color:var(--t2);margin-left:6px;letter-spacing:2px}
.dr-head .done{padding:7px 16px;border-radius:var(--r-pill);background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;font-size:12px;font-weight:500;box-shadow:0 3px 10px rgba(168,118,130,.3);border:none;cursor:pointer;font-family:var(--sans-cn)}

.b-block{background:rgba(255,253,254,.7);border:1px solid rgba(255,255,255,.85);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:0 3px 10px rgba(180,120,130,.06);transition:all .2s}
.b-block.open{background:rgba(255,253,254,.95);box-shadow:0 6px 16px rgba(180,120,130,.12)}
.b-row{display:flex;align-items:center;gap:10px;cursor:pointer}
.chk{width:19px;height:19px;border-radius:50%;flex-shrink:0;border:1.3px solid var(--t3);background:transparent;display:grid;place-items:center;transition:all .2s;cursor:pointer}
.chk.on{border-color:var(--rose);background:var(--rose)}
.chk.on::after{content:'';width:8px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.b-name{flex:1;font-family:var(--serif-cn);font-size:14px;color:var(--t1);font-weight:600}
.b-count{font-size:11px;color:var(--rose-deep);margin-right:8px}
.b-pick{font-size:11px;color:var(--rose-deep);padding:4px 9px;border-radius:6px;background:rgba(212,165,176,.14);cursor:pointer;user-select:none}
.b-pick .b-arr{margin-left:3px;font-size:9px;display:inline-block;transition:transform .2s}
.b-block.open .b-pick .b-arr{transform:rotate(180deg)}
.s-list{margin-top:10px;padding-top:10px;border-top:.5px dashed var(--pearl);display:none}
.b-block.open .s-list{display:block}
.s-line{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px;color:var(--t1);cursor:pointer}
.s-line .txt{font-family:var(--serif-cn);flex:1}

/* Simple input dialog (for category tab adding) */
.dialog{
  position:fixed;left:50%;top:50%;transform:translate(-50%,-40%);z-index:82;
  width:calc(100% - 60px);max-width:340px;
  background:rgba(255,251,253,.96);backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);border-radius:20px;
  padding:22px 20px;box-shadow:0 20px 60px rgba(160,100,110,.28);
  opacity:0;pointer-events:none;transition:all .25s;
}
.dialog.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.dialog .dt{font-family:var(--serif-en);font-style:italic;font-size:18px;color:var(--t1);text-align:center}
.dialog .dt .cn{font-family:var(--serif-cn);font-style:normal;font-size:12px;color:var(--t2);margin-left:6px;letter-spacing:2px}
.dialog .di{
  width:100%;margin-top:16px;padding:11px 14px;border-radius:12px;
  border:1px solid var(--pearl);background:rgba(255,255,255,.7);
  font-family:var(--serif-cn);font-size:14px;color:var(--t1);outline:none;
}
.dialog .di:focus{border-color:var(--rose)}
.dialog .dbtns{display:flex;gap:8px;margin-top:14px}
.dialog .dbtns button{flex:1;padding:9px 0;border-radius:var(--r-pill);border:none;font-size:13px;font-family:var(--sans-cn);cursor:pointer}
.dialog .dbtns .cancel{background:rgba(212,165,176,.14);color:var(--t2)}
.dialog .dbtns .ok{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;font-weight:500;box-shadow:0 3px 10px rgba(168,118,130,.28)}

/* ===== Confirm dialog（不用系统 confirm —— file:// 或 Safari 屏蔽过一次就永远返回 false） ===== */
.cfm{position:fixed;inset:0;z-index:96;display:grid;place-items:center;padding:0 34px;opacity:0;pointer-events:none;transition:opacity .24s}
.cfm.on{opacity:1;pointer-events:auto}
.cfm-bd{position:absolute;inset:0;background:rgba(90,61,74,.36);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cfm-box{
  position:relative;width:100%;max-width:300px;
  background:rgba(255,253,254,.94);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);border-radius:22px;
  box-shadow:0 18px 48px rgba(160,100,110,.28),inset 0 1px 0 rgba(255,255,255,.95);
  padding:22px 20px 16px;text-align:center;
  transform:scale(.94);transition:transform .26s cubic-bezier(.2,.8,.2,1);
}
.cfm.on .cfm-box{transform:scale(1)}
.cfm-tx{font-family:var(--serif-cn);font-weight:500;font-size:14.5px;line-height:1.9;color:var(--t1);margin-bottom:18px}
.cfm-ops{display:flex;gap:9px}
.cfm-op{flex:1;padding:11px 0;border-radius:var(--r-pill);border:none;cursor:pointer;font-size:13.5px;font-family:var(--sans-cn);letter-spacing:1px}
.cfm-op.no{background:rgba(255,255,255,.72);color:var(--t2);border:.5px solid var(--pearl)}
.cfm-op.yes{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;font-weight:500;box-shadow:0 4px 13px rgba(168,118,130,.32)}
.cfm-op:active{transform:scale(.97)}
/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;top:24%;transform:translate(-50%,-8px);z-index:90;
  padding:10px 18px;border-radius:var(--r-pill);
  background:rgba(90,61,74,.88);color:#fff;font-size:12.5px;
  opacity:0;pointer-events:none;transition:all .3s;
  font-family:var(--sans-cn);letter-spacing:.5px;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Tabbar ===== */
.tabbar-wrap{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:60}
.tabbar{
  position:relative;pointer-events:auto;
  width:100%;max-width:396px;
  padding:6px 10px;
  background:rgba(255,253,254,.78);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-pill);
  box-shadow:0 12px 32px rgba(180,120,130,.22),0 2px 6px rgba(180,120,130,.10),inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;justify-content:space-between;align-items:center;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px;color:var(--t3);cursor:pointer;transition:color .2s}
.tab.on{color:var(--rose-deep)}
.tab-ic{width:28px;height:24px;display:grid;place-items:center}
.tab svg{width:21px;height:21px;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;letter-spacing:.5px;font-family:var(--sans-cn);font-weight:500}
.tab.home{position:relative;flex:0 0 auto;width:60px}
.tab.home .home-btn{
  position:absolute;left:50%;top:-22px;transform:translateX(-50%);
  width:50px;height:50px;border-radius:50%;background:var(--rose);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 8px 18px rgba(200,140,150,.42),0 2px 5px rgba(200,140,150,.22),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 4px rgba(140,80,90,.15);
}
.tab.home .home-btn svg{width:22px;height:22px;stroke-width:1.8}
.tab.home span{margin-top:30px;color:var(--rose-deep);font-weight:600}
</style></head>
<body>
<div class="phone">
<!-- SVG defs -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gradRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A5B0"/>
      <stop offset="100%" stop-color="#A87682"/>
    </linearGradient>
  </defs>
</svg>

<!-- Top tabs -->
<div class="tabs" id="tabs">
  <div class="tab-pill on" data-tab="immerse">沉浸念</div>
  <div class="tab-pill" data-tab="wealth">财富金钱</div>
  <div class="tab-pill" data-tab="career">事业职场</div>
  <div class="tab-pill" data-tab="love">爱情关系</div>

<script>
/* ===== 本地持久化 =====
   刷新、以及 iOS PWA 被系统回收内存后重开，都要能恢复。
   localStorage 在 iOS 上只有 ~5MB，所以图片一律压缩后再存（见 shrinkImage）。 */
const LS_KEY = 'reverie.affirm.v1';
let lsBlocked = false;
function lsSave(){
  if(lsBlocked) return;
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(dumpState()));
  }catch(e){
    /* 存满了。别反复弹，冷却 3 秒 */
    lsBlocked = true;
    showToast('存不下了，图片太多。删掉几张再试');
    setTimeout(()=>{ lsBlocked = false; }, 3000);
  }
}
function lsLoad(){
  let d;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return;
    d = JSON.parse(raw);
  }catch(e){ return; }   /* 数据坏了就当没存过，不能让整页挂掉 */
  if(!d || typeof d !== 'object') return;
  try{ applyState(d); }catch(e){}
}

/* 图片存前压到最长边 1080、WebP 质量 .82。
   相册原图 DataURL 动辄好几 MB，不压必然爆 localStorage。 */
function shrinkImage(dataURL, cb, maxPx, q){
  maxPx = maxPx || 1080; q = q || .82;
  const img = new Image();
  img.onload = ()=>{
    let w = img.width, h = img.height;
    const scale = Math.min(1, maxPx / Math.max(w, h));
    w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    let out = null;
    try{ out = c.toDataURL('image/webp', q); }catch(e){}
    if(!out || out.indexOf('data:image/webp') !== 0){
      try{ out = c.toDataURL('image/jpeg', q); }catch(e){ out = null; }
    }
    cb(out && out.length < dataURL.length ? out : dataURL);
  };
  img.onerror = ()=>cb(dataURL);
  img.src = dataURL;
}

/* 存的就是这三样：板块、当前清单、停在哪个 tab */
function dumpState(){
  return { boards: BOARDS, recite: reciteList, tab: currentTab };
}
function applyState(d){
  /* 合并而不是整体替换：BOARDS 是 const，而且以后加字段时旧存档不该把新板块弄丢。
     这个页面没有删板块的功能，所以不用管"删过的板块别复活"。 */
  if(d.boards && typeof d.boards === 'object'){
    Object.keys(d.boards).forEach(k=>{ BOARDS[k] = d.boards[k]; });
  }
  if(Array.isArray(d.recite)) reciteList = d.recite;
  if(typeof d.tab === 'string') currentTab = d.tab;
}

/* ===== 念诵时长统计（跨页面共享，me.html 会读） ===== */
const STATS_KEY = 'reverie.stats.v1';
/* 结构：
   {
     byBoard: { [boardKey]: { name: '财富金钱', mins: 135 } },
     byDay:   { '2026-08-31': 42 }                             // 分钟，整数
   }
   沉浸念（多板块混念）记到 byBoard 的 '__immerse__' 下，name 用 '沉浸念'。 */
function statsRead(){
  try{
    const d = JSON.parse(localStorage.getItem(STATS_KEY) || '{}');
    return { byBoard: d.byBoard || {}, byDay: d.byDay || {} };
  }catch(e){ return { byBoard:{}, byDay:{} }; }
}
function statsAdd(boardKey, boardName, mins){
  mins = Math.round(mins);
  if(!(mins > 0)) return;
  const s = statsRead();
  const b = s.byBoard[boardKey] || { name: boardName, mins: 0 };
  b.name = boardName; b.mins += mins;
  s.byBoard[boardKey] = b;
  const t = new Date();
  const k = t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(t.getDate()).padStart(2,'0');
  s.byDay[k] = (s.byDay[k] || 0) + mins;
  try{ localStorage.setItem(STATS_KEY, JSON.stringify(s)); }catch(e){}
}
/* 135 → '2h 15m'，45 → '45m'，没念过就是 '0m' */
function fmtMins(m){
  m = Math.max(0, Math.round(m || 0));
  const h = Math.floor(m/60), r = m%60;
  if(h > 0) return h + 'h ' + String(r).padStart(2,'0') + 'm';
  return r + 'm';
}

/* ========== Data ========== */

const BOARDS = {

/* Recite list (currently active list, shown on 沉浸念) */
let reciteList = [
  {txt:'我是财富的磁石',tag:'财富',from:'wealth'},
  {txt:'钱轻松地流向我',tag:'财富',from:'wealth'},
  {txt:'我值得所有的丰盛',tag:'财富',from:'wealth'},

/* Board images map: which categories have "user uploaded" first image
   In demo we use CSS gradient placeholders (g1..g6) */
function buildBoardTiles(tab){
  const wrap = document.getElementById('board');
  wrap.innerHTML = '';
  let items = []; // {kind:'img'|'grad'|'empty', img?, color?, key?, idx?}

  if(tab === 'immerse'){
    /* 沉浸念：把清单涉及到的板块里传过的图**全部**摊出来，最多铺 6 格。
       以前是 used[i%used.length] 再取 images[0] —— 板块少于 6 个就会把同一张图循环铺好几遍，
       只传一张的话六格里能看见三张一样的。图不够就用不重样的渐变补位。 */
    const used = [...new Set(reciteList.map(l=>l.from).filter(Boolean))];
    const pics = [];
    used.forEach(key=>{
      const b = BOARDS[key];
      if(!b || !b.images) return;
      b.images.forEach(img=>{
        if(img && !pics.includes(img)) pics.push(img);
      });
    });
    const PAL = ['g1','g2','g3','g4','g5','g6'];
    for(let i=0;i<6;i++){
      if(i < pics.length) items.push({kind:'img',img:pics[i],readonly:true});
      else items.push({kind:'grad',color:PAL[i],readonly:true});
    }
  } else if(BOARDS[tab]){
    const b = BOARDS[tab];
    if(!b.images) b.images = [null,null,null,null,null,null];
    for(let i=0;i<6;i++){
      const img = b.images[i];
      if(img) items.push({kind:'img',img,key:tab,idx:i});
      else items.push({kind:'empty',key:tab,idx:i});
    }
  } else {
    for(let i=0;i<6;i++) items.push({kind:'empty'});
  }

  items.forEach(it=>{
    const t = document.createElement('div');
    if(it.kind === 'img'){
      t.className = 'tile has-img';
      t.style.backgroundImage = `url(${it.img})`;
      if(!it.readonly){
        t.dataset.key = it.key;
        t.dataset.idx = it.idx;
        t.addEventListener('click',()=>openImgSheet(it.key,it.idx,true));
      }
    } else if(it.kind === 'grad'){
      t.className = 'tile ' + it.color;
    } else {
      t.className = 'tile empty';
      t.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>';
      if(it.key){
        t.dataset.key = it.key;
        t.dataset.idx = it.idx;
        t.addEventListener('click',()=>openImgSheet(it.key,it.idx,false));
      }
    }
    wrap.appendChild(t);
  });
}

/* ========== Image upload / replace / delete ========== */
let imgSheetCtx = null; // {key,idx,hasImg}
const imgSheet = document.getElementById('imgSheet');
const fileInput = document.getElementById('fileInput');

function openImgSheet(key,idx,hasImg){
  imgSheetCtx = {key,idx,hasImg};
  document.getElementById('opPickText').textContent = hasImg ? '替换图片' : '从相册选择';
  document.getElementById('opDelete').style.display = hasImg ? '' : 'none';
  imgSheet.classList.add('on');
  mask.classList.add('on');
}
function closeImgSheet(){
  imgSheet.classList.remove('on');
  mask.classList.remove('on');
  imgSheetCtx = null;
}
imgSheet.querySelector('[data-op="pick"]').addEventListener('click',()=>{
  fileInput.click();
});
document.getElementById('opDelete').addEventListener('click',()=>{
  if(!imgSheetCtx) return;
  const {key,idx} = imgSheetCtx;
  if(BOARDS[key] && BOARDS[key].images) BOARDS[key].images[idx] = null;
  closeImgSheet();
  buildBoardTiles(currentTab);
  lsSave();
  showToast('已移除');
});
document.getElementById('opCancel').addEventListener('click',closeImgSheet);
fileInput.addEventListener('change',(e)=>{
  const file = e.target.files && e.target.files[0];
  if(!file || !imgSheetCtx){ closeImgSheet(); return; }
  const {key,idx} = imgSheetCtx;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    closeImgSheet();
    /* 原图直接存必爆 5MB，先压 */
    shrinkImage(ev.target.result, (small)=>{
      if(!BOARDS[key].images) BOARDS[key].images = [null,null,null,null,null,null];
      BOARDS[key].images[idx] = small;
      buildBoardTiles(currentTab);
      lsSave();
      showToast('已添加');
    });
  };
  reader.readAsDataURL(file);
  fileInput.value = '';
});

/* ========== Tab switching ========== */
/* 统计行只画这一处，念完一轮也要重画，所以单独拆出来 */
function paintStatLine(){
  const statLine = document.getElementById('statLine');
  const statText = document.getElementById('statText');
  const b = BOARDS[currentTab];
  if(!b){ statLine.classList.remove('show'); return; }
  statLine.classList.add('show');
  /* 真实累计，从 statsRead() 拿。没念过就是 0m —— 以前这里是写死的假数字，
     还挂了 contenteditable 让人手改，那更假 */
  const mins = (statsRead().byBoard[currentTab] || {}).mins || 0;
  statText.textContent = b.name + ' · 累计 ' + fmtMins(mins);
}
function switchTab(tab){
  currentTab = tab;
  document.querySelectorAll('.tab-pill').forEach(p=>{
    p.classList.toggle('on', p.dataset.tab===tab);
  });
  const listTitle = document.getElementById('listTitle');
  const addBtn = document.getElementById('addBtn');
  paintStatLine();
  listTitle.textContent = BOARDS[tab] ? BOARDS[tab].name + '肯定语' : '念诵清单';
  addBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg> 添加句子';
  buildBoardTiles(tab);
  renderList();
  resetClock();
  lsSave();
}

/* ========== List rendering ========== */
function renderList(){
  const body = document.getElementById('listBody');
  const cnt = document.getElementById('listCount');
  body.innerHTML = '';
  let items;
  if(currentTab === 'immerse'){
    items = reciteList.map((l,i)=>({txt:l.txt,tag:l.tag,idx:i,cat:false}));
  } else if(BOARDS[currentTab]){
    items = BOARDS[currentTab].lines.map((t,i)=>({txt:t,idx:i,cat:true}));
  } else {
    items = [];
  }
  cnt.textContent = '· ' + items.length + ' 句';
  if(items.length === 0){
    body.innerHTML = '<div class="line-empty">还没有句子 · 点右上"添加句子"</div>';
    return;
  }
  items.forEach(it=>{
    const row = document.createElement('div');
    row.className = 'line';
    const tagHtml = it.tag ? `<span class="tag">${it.tag}</span>` : '';
    row.innerHTML = `<span class="txt">${it.txt}</span>${tagHtml}<span class="x" data-i="${it.idx}">×</span>`;
    body.appendChild(row);
  });
  body.querySelectorAll('.x').forEach(x=>{
    x.addEventListener('click',()=>{
      const i = +x.dataset.i;
      if(currentTab === 'immerse'){ reciteList.splice(i,1); }
      else if(BOARDS[currentTab]){ BOARDS[currentTab].lines.splice(i,1); }
      renderList();
      if(currentTab==='immerse') buildBoardTiles('immerse');
      lsSave();
    });
  });
}

/* ========== Drawer (沉浸念添加句子) ========== */
const mask = document.getElementById('mask');
const drawer = document.getElementById('drawer');
const drawerBody = document.getElementById('drawerBody');

/* selection state inside drawer */
let drawerSel = {}; // {wealth:Set([0,1,2]), career:Set([3]), ...}
let drawerOpen = {}; // {wealth:true}

function openDrawer(){
  // Init selection from current reciteList (map txt back to board)
  drawerSel = {};
  drawerOpen = {};
  Object.keys(BOARDS).forEach(k=>{drawerSel[k]=new Set();drawerOpen[k]=false});
  reciteList.forEach(l=>{
    if(l.from && BOARDS[l.from]){
      const idx = BOARDS[l.from].lines.indexOf(l.txt);
      if(idx>=0) drawerSel[l.from].add(idx);
    }
  });
  renderDrawer();
  mask.classList.add('on');
  drawer.classList.add('on');
}
function closeDrawer(){
  mask.classList.remove('on');
  drawer.classList.remove('on');
}
function renderDrawer(){
  drawerBody.innerHTML = '';
  Object.keys(BOARDS).forEach(key=>{
    const b = BOARDS[key];
    const sel = drawerSel[key];
    const open = drawerOpen[key];
    const boardChecked = sel.size > 0;
    const block = document.createElement('div');
    block.className = 'b-block' + (open ? ' open' : '');
    let sHtml = '';
    b.lines.forEach((line,i)=>{
      const on = sel.has(i) ? 'on' : '';
      sHtml += `<div class="s-line" data-k="${key}" data-i="${i}"><div class="chk ${on}"></div><span class="txt">${line}</span></div>`;
    });
    block.innerHTML = `
      <div class="b-row" data-k="${key}">
        <div class="chk ${boardChecked?'on':''}" data-role="board-chk"></div>
        <div class="b-name">${b.name}</div>
        <div class="b-count">${sel.size}/${b.lines.length} 句</div>
        <div class="b-pick" data-role="pick">选句<span class="b-arr">▼</span></div>
      </div>
      <div class="s-list">${sHtml}</div>
    `;
    drawerBody.appendChild(block);
  });

  // bind row header click (toggle open)
  drawerBody.querySelectorAll('.b-pick').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const k = el.closest('.b-row').dataset.k;
      drawerOpen[k] = !drawerOpen[k];
      renderDrawer();
    });
  });
  // bind board-chk: toggle select all lines in the board
  drawerBody.querySelectorAll('[data-role="board-chk"]').forEach(el=>{
    el.addEventListener('click',(e)=>{
      e.stopPropagation();
      const k = el.closest('.b-row').dataset.k;
      const total = BOARDS[k].lines.length;
      if(drawerSel[k].size === total){ drawerSel[k].clear(); }
      else{ drawerSel[k] = new Set(Array.from({length:total},(_,i)=>i)); }
      renderDrawer();
    });
  });
  // bind s-line
  drawerBody.querySelectorAll('.s-line').forEach(el=>{
    el.addEventListener('click',()=>{
      const k = el.dataset.k;
      const i = +el.dataset.i;
      if(drawerSel[k].has(i)) drawerSel[k].delete(i);
      else drawerSel[k].add(i);
      renderDrawer();
    });
  });
}
function applyDrawer(){
  reciteList = [];
  Object.keys(drawerSel).forEach(k=>{
    const b = BOARDS[k];
    const tag = b.name.slice(0,2);
    [...drawerSel[k]].sort((a,b)=>a-b).forEach(i=>{
      reciteList.push({txt:b.lines[i],tag,from:k});
    });
  });
  renderList();
  buildBoardTiles('immerse');
  closeDrawer();
  lsSave();
  showToast('清单已更新');
}

/* ========== Dialog (分类 tab 添加句子) ========== */
const dialog = document.getElementById('dialog');
const dlgInput = document.getElementById('dlgInput');
const dlgCn = document.getElementById('dlgCn');
function openDialog(){
  dlgInput.value = '';
  dlgCn.textContent = '给「' + (BOARDS[currentTab]?.name||'') + '」添加一句';
  dialog.classList.add('on');
  mask.classList.add('on');
  setTimeout(()=>dlgInput.focus(),200);
}
function closeDialog(){
  dialog.classList.remove('on');
  mask.classList.remove('on');
}
function applyDialog(){
  const v = dlgInput.value.trim();
  if(!v) return;
  if(BOARDS[currentTab]){
    BOARDS[currentTab].lines.push(v);
    renderList();
    lsSave();
    showToast('已添加');
  }
  closeDialog();
}

document.getElementById('addBtn').addEventListener('click',()=>{
  if(currentTab === 'immerse') openDrawer();
  else if(BOARDS[currentTab]) openDialog();
});
document.getElementById('drawerDone').addEventListener('click',applyDrawer);
mask.addEventListener('click',()=>{
  if(drawer.classList.contains('on')) closeDrawer();
  if(dialog.classList.contains('on')) closeDialog();
  if(document.getElementById('newBoardDialog').classList.contains('on')) closeNewBoardDialog();
  if(imgSheet.classList.contains('on')) closeImgSheet();
});
document.getElementById('dlgCancel').addEventListener('click',closeDialog);
document.getElementById('dlgOk').addEventListener('click',applyDialog);
dlgInput.addEventListener('keydown',(e)=>{if(e.key==='Enter') applyDialog()});

/* ========== Clock ========== */
const clockWrap = document.getElementById('clockWrap');
const clockCenter = document.getElementById('clockCenter');
const ringProg = document.getElementById('ringProg');
const durPills = document.getElementById('durPills');
const CIRC = 2 * Math.PI * 47; // ~295.31

let clockState = 'idle'; // idle | up | down | paused
let clockMode = 'up';    // up | down
let selectedMin = 0;     // 0 = 正计时
let elapsedSec = 0;      // for up
let totalSec = 0;        // for down
let clockTimer = null;
let startTs = 0;

function pad(n){return String(n).padStart(2,'0')}
function fmt(sec){
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec/3600);
  const m = Math.floor((sec%3600)/60);
  const s = sec%60;
  if(h>0) return h + ':' + pad(m) + ':' + pad(s);
  return pad(m) + ':' + pad(s);
}
function paintCenterIdle(){
  clockCenter.innerHTML = `<div class="center-idle"><div class="big">开始</div><div class="sub">${clockMode==='down' ? '倒计时 '+selectedMin+'m' : '正计时'}</div></div>`;
}
function paintCenterRunning(){
  const disp = clockMode==='up' ? fmt(elapsedSec) : fmt(totalSec - elapsedSec);
  const sub = clockMode==='up' ? (clockState==='paused'?'已暂停':'正计时中') : (clockState==='paused'?'已暂停 · 剩余':'倒计时 · 剩余');
  clockCenter.innerHTML = `<div class="center-running"><div class="big">${disp}</div><div class="sub">${sub}</div></div>`;
}
function paintRing(){
  clockWrap.classList.remove('countup');
  if(clockMode==='up'){
    if(clockState==='up'||clockState==='paused'){
      clockWrap.classList.add('countup');
    }
    ringProg.setAttribute('stroke-dasharray','none');
    ringProg.setAttribute('stroke-dashoffset','0');
  } else {
    // down: arc消退
    ringProg.setAttribute('stroke-dasharray', CIRC.toFixed(2));
    let remain = totalSec - elapsedSec;
    const ratio = totalSec>0 ? remain/totalSec : 0;
    const off = CIRC * (1 - ratio);
    ringProg.setAttribute('stroke-dashoffset', off.toFixed(2));
  }
}
function paintDurPills(){
  durPills.querySelectorAll('.d').forEach(d=>{
    const m = +d.dataset.min;
    d.classList.toggle('on', clockMode==='down' && m===selectedMin);
    d.classList.toggle('disabled', clockState==='up' || clockState==='down' || clockState==='paused');
  });
}
function resetClock(){
  stopTicker();
  clockState = 'idle';
  clockMode = 'up';
  selectedMin = 0;
  elapsedSec = 0;
  totalSec = 0;
  clockWrap.classList.remove('running','countup');
  ringProg.setAttribute('stroke-dasharray','none');
  ringProg.setAttribute('stroke-dashoffset','0');
  paintCenterIdle();
  paintDurPills();
}
function startTicker(){
  stopTicker();
  startTs = Date.now() - elapsedSec*1000;
  clockTimer = setInterval(()=>{
    elapsedSec = Math.floor((Date.now() - startTs) / 1000);
    if(clockMode==='down' && elapsedSec >= totalSec){
      elapsedSec = totalSec;
      paintCenterRunning();
      paintRing();
      finishClock(true);
      return;
    }
    paintCenterRunning();
    paintRing();
  }, 250);
}
function stopTicker(){ if(clockTimer){clearInterval(clockTimer);clockTimer=null} }

function startClock(){
  if(clockMode==='down' && totalSec===0){ selectedMin = 25; totalSec = 25*60; }
  clockState = clockMode; // 'up' or 'down'
  clockWrap.classList.add('running');
  paintCenterRunning();
  paintRing();
  paintDurPills();
  startTicker();
}
function pauseClock(){
  clockState = 'paused';
  stopTicker();
  paintCenterRunning();
}
function resumeClock(){
  clockState = clockMode;
  startTicker();
  paintCenterRunning();
}
function finishClock(auto){
  /* 正计时按实际走过的秒数，倒计时走完了就是整段；提前长按结束也走这里，
     用 elapsedSec，不能拿 totalSec 当真实时长 */
  const secs = clockMode==='up' ? elapsedSec : (auto ? totalSec : elapsedSec);
  const mins = Math.floor(secs/60);
  const rem = secs%60;
  const label = mins>0 ? (mins + '分' + (rem?' '+rem+'秒':'')) : (rem+'秒');
  const catName = BOARDS[currentTab]?.name || '沉浸念';
  /* 真实累计写进跨页面的 stats。不满 1 分钟 statsAdd 自己会挡掉 */
  statsAdd(BOARDS[currentTab] ? currentTab : '__immerse__', catName, secs/60);
  showToast(auto ? `完成 · 记录 ${label} → ${catName}` : `本次 ${label} 已记录 → ${catName}`);
  resetClock();
  paintStatLine();
}

/* Click on ring: start / pause / resume */
let holdTimer = null;
clockWrap.addEventListener('click',()=>{
  if(holdTimer) return; // long-press already handled
  if(clockState==='idle') startClock();
  else if(clockState==='up'||clockState==='down') pauseClock();
  else if(clockState==='paused') resumeClock();
});
/* Long-press to end */
function bindHold(el){
  const on = ()=>{
    if(clockState==='idle') return;
    holdTimer = setTimeout(()=>{
      holdTimer = null;
      ask('结束本次念诵并记录时长？',()=>finishClock(false));
    }, 700);
  };
  const off = ()=>{ if(holdTimer){clearTimeout(holdTimer);holdTimer=null} };
  el.addEventListener('mousedown',on);
  el.addEventListener('touchstart',on,{passive:true});
  el.addEventListener('mouseup',off);
  el.addEventListener('mouseleave',off);
  el.addEventListener('touchend',off);
  el.addEventListener('touchcancel',off);
}
bindHold(clockWrap);

/* Duration pills */
durPills.querySelectorAll('.d').forEach(d=>{
  d.addEventListener('click',()=>{
    if(clockState!=='idle') return;
    const m = +d.dataset.min;
    if(clockMode==='down' && selectedMin===m){
      clockMode = 'up';
      selectedMin = 0;
      totalSec = 0;
    } else {
      clockMode = 'down';
      selectedMin = m;
      totalSec = m*60;
      elapsedSec = 0;
    }
    paintCenterIdle();
    paintDurPills();
    // preview arc on idle down
    if(clockMode==='down'){
      ringProg.setAttribute('stroke-dasharray', CIRC.toFixed(2));
      ringProg.setAttribute('stroke-dashoffset','0');
    } else {
      ringProg.setAttribute('stroke-dasharray','none');
      ringProg.setAttribute('stroke-dashoffset','0');
    }
  });
});

/* ========== Confirm ==========
   自己画的确认框。系统 confirm 被浏览器"阻止此页面弹出对话框"勾掉一次之后就永远返回
   false —— 按钮看着能点，点了什么都不发生，跟坏了一样。 */
const cfm = document.getElementById('cfm');
let cfmCb = null;
function ask(text, onYes){
  document.getElementById('cfmTx').textContent = text;
  cfmCb = onYes;
  cfm.classList.add('on');
}
function cfmClose(){ cfm.classList.remove('on'); cfmCb = null; }
document.getElementById('cfmNo').addEventListener('click',cfmClose);
document.getElementById('cfmBd').addEventListener('click',cfmClose);
document.getElementById('cfmYes').addEventListener('click',()=>{
  const cb = cfmCb; cfmClose(); if(cb) cb();
});
/* ========== Toast ========== */
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('on'), 1800);
}

/* ========== Tab bindings ========== */
document.querySelectorAll('.tab-pill').forEach(p=>{
  if(p.dataset.tab) p.addEventListener('click',()=>switchTab(p.dataset.tab));
});
document.getElementById('addTab').addEventListener('click',()=>{
  openNewBoardDialog();
});

/* ========== New board dialog ========== */
function openNewBoardDialog(){
  const d = document.getElementById('newBoardDialog');
  document.getElementById('nbInput').value = '';
  d.classList.add('on');
  mask.classList.add('on');
  setTimeout(()=>document.getElementById('nbInput').focus(),200);
}
function closeNewBoardDialog(){
  document.getElementById('newBoardDialog').classList.remove('on');
  mask.classList.remove('on');
}
function applyNewBoard(){
  const v = document.getElementById('nbInput').value.trim();
  if(!v){ showToast('请输入板块名'); return; }
  const key = 'custom_' + Date.now();
  const palettes = ['g1','g2','g3','g4','g5','g6'];
  BOARDS[key] = {
    name: v,
    color: palettes[Math.floor(Math.random()*palettes.length)],
    lines: [],
    images: [null,null,null,null,null,null]
  };
  addBoardPill(key, v);
  closeNewBoardDialog();
  switchTab(key);   /* 里面已经 lsSave 了 */
  showToast('已新建「' + v + '」');
}
/* 把一个板块塞成顶部胶囊，插在「+ 新建」前面。
   新建时用，恢复存档时也用 —— 存档里的自定义板块 HTML 里没有对应胶囊 */
function addBoardPill(key, name){
  const pill = document.createElement('div');
  pill.className = 'tab-pill';
  pill.dataset.tab = key;
  pill.textContent = name;
  pill.addEventListener('click',()=>switchTab(key));
  document.getElementById('addTab').before(pill);
}
document.getElementById('nbCancel').addEventListener('click',closeNewBoardDialog);
document.getElementById('nbOk').addEventListener('click',applyNewBoard);
document.getElementById('nbInput').addEventListener('keydown',e=>{if(e.key==='Enter') applyNewBoard()});

/* ========== Init ========== */
/* 先恢复存档再画第一帧，不然会先画假数据再闪一下 */
lsLoad();
/* 存档里的自定义板块，HTML 里没有胶囊，得补出来 */
Object.keys(BOARDS).forEach(k=>{
  if(!document.querySelector('.tab-pill[data-tab="'+k+'"]')) addBoardPill(k, BOARDS[k].name);
});
switchTab((BOARDS[currentTab] || currentTab === 'immerse') ? currentTab : 'immerse');
</script>
