<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FFF3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reverie">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>我的 · Reverie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg-image:none;
  --bg-gradient:
    radial-gradient(1200px 800px at 15% -10%,#F5CDDB 0%,transparent 55%),
    radial-gradient(1000px 700px at 100% 100%,#F6D5DE 0%,transparent 60%),
    #FFF3F7;
  --surface:rgba(255,253,254,.88);
  --pearl:#F1E3E8;
  --rose:#D4A5B0;
  --rose-deep:#A87682;
  --rose-soft:#E9C4CD;
  --gold:#C9A87A;
  --t1:#5A3D4A;
  --t2:#8B6B7A;
  --t3:#B89AAA;
  --serif-en:'Cormorant Garamond',serif;
  --sans-en:'Inter',-apple-system,sans-serif;
  --serif-cn:'Noto Serif SC',serif;
  --sans-cn:-apple-system,'PingFang SC',sans-serif;
  --r-card:20px;
  --r-pill:999px;
  --shadow-card:0 6px 24px rgba(180,120,130,.14),inset 0 1px 0 rgba(255,255,255,.9);
}
html{height:100%}
body{
  font-family:var(--sans-cn);color:var(--t1);font-size:15px;
  background-color:#FFF3F7;
  background-image:var(--bg-image),var(--bg-gradient);
  background-size:cover;background-position:center;
  background-attachment:fixed;background-repeat:no-repeat;
  min-height:100%;overflow-x:hidden;
  /* 底 tabbar 是 fixed 的，首页那个球还往上凸 22px —— 留够，别让内容被压在底下 */
  padding-bottom:calc(118px + env(safe-area-inset-bottom));
}
.phone{max-width:420px;margin:0 auto;position:relative;padding:0 14px;padding-top:calc(env(safe-area-inset-top,20px) + 14px)}
/* Cormorant 老式数字会把 1 写成小写 i */
.tr-sum,.bd-time,.mi-ax div,.set-v{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1,"onum" 0}
/* ===== Identity ===== */
.id-row{display:flex;align-items:center;gap:13px;padding:2px 4px 18px}
.avatar{
  width:58px;height:58px;border-radius:50%;flex-shrink:0;position:relative;
  background:linear-gradient(145deg,#F4C8D4 0%,var(--rose) 48%,var(--rose-deep) 100%);
  background-size:cover;background-position:center;cursor:pointer;
  box-shadow:0 6px 18px rgba(168,118,130,.30),
             inset 0 1px 0 rgba(255,255,255,.55),
             inset 0 -3px 6px rgba(140,80,90,.14);
}
/* 没传图时露出的相机小角标 */
.avatar .cam{
  position:absolute;right:-1px;bottom:-1px;width:21px;height:21px;border-radius:50%;
  background:rgba(255,253,254,.94);display:grid;place-items:center;
  box-shadow:0 2px 7px rgba(168,118,130,.28);
}
.avatar .cam svg{width:11px;height:11px;fill:none;stroke:var(--rose-deep);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.avatar:active{transform:scale(.97)}
.id-txt{min-width:0;flex:1}
.id-name{
  font-family:var(--serif-cn);font-weight:600;font-size:18px;color:var(--t1);
  letter-spacing:.5px;outline:none;display:inline-block;
  border-bottom:.5px dashed rgba(212,165,176,.5);padding:0 3px 2px;transition:border-color .2s;
}
.id-name:focus{border-bottom-color:var(--rose-deep)}
.id-hint{font-family:var(--serif-en);font-style:italic;font-size:12px;color:var(--t3);letter-spacing:.6px;margin-top:5px}

/* ===== Section title ===== */
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:2px 4px 11px}
.sec-l{display:flex;align-items:baseline;gap:8px}
.sec-l .en{font-family:var(--serif-en);font-size:19px;font-weight:500;color:var(--t1);font-style:italic;letter-spacing:.4px}
.sec-l .cn{font-family:var(--serif-cn);font-size:11px;color:var(--t2);letter-spacing:2px}

/* ===== Glass card ===== */
.card{
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  padding:15px 16px 12px;margin-bottom:18px;
}

/* ===== Mini 7-day bars ===== */
.mi-top{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:11px}
.mi-top .l{font-family:var(--serif-cn);font-size:12.5px;color:var(--t2);letter-spacing:.5px}
.tr-sum{font-family:var(--serif-en);font-weight:600;font-size:14px;color:var(--rose-deep);letter-spacing:.3px}
.mi-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:40px}
.mi-bar{
  border-radius:5px 5px 3px 3px;
  background:linear-gradient(180deg,var(--rose-soft) 0%,var(--rose) 50%,var(--rose-deep) 100%);
  box-shadow:0 2px 6px rgba(168,118,130,.2),inset 0 1px 0 rgba(255,255,255,.6);
  min-height:3px;
}
.mi-bar.today{box-shadow:0 2px 8px rgba(168,118,130,.3),inset 0 1px 0 rgba(255,255,255,.75),0 0 0 1.2px var(--gold)}
.mi-bar.zero{opacity:.24}
.mi-ax{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:7px}
.mi-ax div{text-align:center;font-family:var(--sans-en);font-size:9px;color:var(--t3);letter-spacing:.6px;font-weight:500}
.mi-ax div.today{color:var(--rose-deep);font-weight:600}

/* ===== Board rows ===== */
.bd-sp{height:12px;margin-top:12px;border-top:.5px dashed var(--pearl)}
.bd-row{display:flex;align-items:center;gap:10px;padding:7px 0}
.bd-name{font-family:var(--serif-cn);font-size:12px;color:var(--t1);width:58px;flex-shrink:0;letter-spacing:.5px}
.bd-track{
  flex:1;height:6px;border-radius:var(--r-pill);
  background:rgba(212,165,176,.18);overflow:hidden;
  box-shadow:inset 0 1px 2px rgba(168,118,130,.12);
}
.bd-fill{
  height:100%;border-radius:var(--r-pill);
  background:linear-gradient(90deg,var(--rose-soft),var(--rose) 55%,var(--rose-deep));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}
.bd-time{font-family:var(--serif-en);font-weight:600;font-size:12px;color:var(--rose-deep);width:50px;text-align:right;flex-shrink:0;letter-spacing:.3px}
/* 一条记录都没有的时候，别画一排贴地的假柱子 */
.tr-empty{font-family:var(--serif-cn);font-size:12.5px;color:var(--t3);letter-spacing:.5px;padding:7px 0 5px}
/* ===== Settings list ===== */
.set{
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  overflow:hidden;
}
.set-row{
  display:flex;align-items:center;gap:10px;
  padding:14px 16px;cursor:pointer;transition:background .18s;
}
.set-row + .set-row{border-top:.5px solid var(--pearl)}
.set-row:active{background:rgba(212,165,176,.09)}
.set-l{flex:1;font-size:14px;color:var(--t1);letter-spacing:.5px}
.set-v{font-size:12.5px;color:var(--t3);letter-spacing:.3px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set-row svg{width:13px;height:13px;flex:0 0 auto;fill:none;stroke:var(--t3);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ===== Sheet（个人信息 / 账号） ===== */
.mask{position:fixed;inset:0;background:rgba(90,61,74,.34);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:80;opacity:0;pointer-events:none;transition:opacity .3s}
.mask.on{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:82;
  max-width:420px;margin:0 auto;
  background:rgba(255,251,253,.97);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.9);
  box-shadow:0 -14px 44px rgba(160,100,110,.24);
  padding:0 20px calc(24px + env(safe-area-inset-bottom));
  transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.85,.2,1);
  max-height:82vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.sh-top{display:flex;align-items:center;justify-content:space-between;padding:15px 0 13px;position:sticky;top:0;background:rgba(255,251,253,.97);z-index:1}
.sh-cancel{font-size:13.5px;color:var(--t2);cursor:pointer;letter-spacing:.5px}
.sh-ttl{font-family:var(--serif-cn);font-weight:600;font-size:15px;color:var(--t1);letter-spacing:1px}
.sh-ok{
  padding:7px 15px;border-radius:var(--r-pill);border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;
  font-size:13px;font-family:var(--sans-cn);font-weight:500;letter-spacing:.5px;
  box-shadow:0 3px 10px rgba(168,118,130,.3);
}
.sh-ok:active{transform:scale(.97)}
.sh-lb{font-size:9.5px;color:var(--gold);letter-spacing:2px;font-weight:500;margin:16px 0 7px;font-family:var(--sans-en);text-transform:uppercase}
.sh-in{
  width:100%;padding:12px 14px;border-radius:14px;
  border:1px solid var(--pearl);background:rgba(255,255,255,.72);
  font-family:var(--serif-cn);font-size:14px;color:var(--t1);outline:none;
  font-weight:500;
}
.sh-in:focus{border-color:var(--rose)}
.sh-ava{display:flex;align-items:center;gap:14px;margin-top:4px}
.sh-ava .pv{
  width:70px;height:70px;border-radius:50%;flex:0 0 auto;cursor:pointer;
  background:linear-gradient(145deg,#F4C8D4,var(--rose) 48%,var(--rose-deep));
  background-size:cover;background-position:center;
  box-shadow:0 5px 15px rgba(168,118,130,.26),inset 0 1px 0 rgba(255,255,255,.5);
}
.sh-ava .tip{font-size:12px;color:var(--t3);line-height:1.8;flex:1}
.sh-ava .tip b{color:var(--rose-deep);font-weight:500;cursor:pointer}
/* 账号抽屉里的行 */
.ac-row{display:flex;align-items:center;padding:13px 0;border-top:.5px solid var(--pearl)}
.ac-row:first-of-type{border-top:none}
.ac-l{flex:1;font-size:13.5px;color:var(--t1)}
.ac-v{font-size:12.5px;color:var(--t3)}
.ac-do{font-size:13px;color:var(--rose-deep);cursor:pointer;letter-spacing:.5px}
.ac-do.warn{color:#B5697A}
.ac-note{font-size:11.5px;color:var(--t3);line-height:1.9;margin-top:14px;padding-top:13px;border-top:.5px dashed var(--pearl)}
.ac-tip{font-family:var(--serif-cn);font-size:13.5px;line-height:1.9;color:var(--t2);letter-spacing:.5px;margin:2px 0 16px}

/* ===== Confirm（不用系统 confirm） ===== */
.cfm{position:fixed;inset:0;z-index:95;display:grid;place-items:center;padding:0 34px;opacity:0;pointer-events:none;transition:opacity .24s}
.cfm.on{opacity:1;pointer-events:auto}
.cfm-bd{position:absolute;inset:0;background:rgba(90,61,74,.36);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
.cfm-box{
  position:relative;width:100%;max-width:300px;
  background:rgba(255,253,254,.94);
  backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
  border:1px solid rgba(255,255,255,.9);border-radius:22px;
  box-shadow:0 18px 48px rgba(160,100,110,.28),inset 0 1px 0 rgba(255,255,255,.95);
  padding:22px 20px 16px;text-align:center;
  transform:scale(.94);transition:transform .26s cubic-bezier(.2,.8,.2,1);
}
.cfm.on .cfm-box{transform:scale(1)}
.cfm-tx{font-family:var(--serif-cn);font-weight:500;font-size:14.5px;line-height:1.9;color:var(--t1);margin-bottom:18px}
.cfm-ops{display:flex;gap:9px}
.cfm-op{flex:1;padding:11px 0;border-radius:var(--r-pill);border:none;cursor:pointer;font-size:13.5px;font-family:var(--sans-cn);letter-spacing:1px}
.cfm-op.no{background:rgba(255,255,255,.72);color:var(--t2);border:.5px solid var(--pearl)}
.cfm-op.yes{background:linear-gradient(135deg,var(--rose),var(--rose-deep));color:#fff;font-weight:500;box-shadow:0 4px 13px rgba(168,118,130,.32)}
.cfm-op:active{transform:scale(.97)}

/* ===== Toast ===== */
.toast{
  position:fixed;left:50%;top:22%;transform:translate(-50%,-8px);z-index:99;
  padding:10px 18px;border-radius:var(--r-pill);
  background:rgba(90,61,74,.88);color:#fff;font-size:12.5px;
  opacity:0;pointer-events:none;transition:all .3s;
  font-family:var(--sans-cn);letter-spacing:.5px;max-width:78vw;text-align:center;line-height:1.6;
}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ===== Tabbar ===== */
.tabbar-wrap{position:fixed;left:0;right:0;bottom:0;padding:0 12px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:60}
.tabbar{
  position:relative;pointer-events:auto;
  width:100%;max-width:396px;padding:6px 10px;
  background:rgba(255,253,254,.78);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-pill);
  box-shadow:0 12px 32px rgba(180,120,130,.22),0 2px 6px rgba(180,120,130,.10),inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;justify-content:space-between;align-items:center;
}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:2px;color:var(--t3);cursor:pointer;transition:color .2s}
.tab.on{color:var(--rose-deep)}
.tab-ic{width:28px;height:24px;display:grid;place-items:center}
.tab svg{width:21px;height:21px;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;letter-spacing:.5px;font-family:var(--sans-cn);font-weight:500}
.tab.home{position:relative;flex:0 0 auto;width:60px}
.tab.home .home-btn{
  position:absolute;left:50%;top:-22px;transform:translateX(-50%);
  width:50px;height:50px;border-radius:50%;background:var(--rose);
  display:grid;place-items:center;color:#fff;
  box-shadow:0 8px 18px rgba(200,140,150,.42),0 2px 5px rgba(200,140,150,.22),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 4px rgba(140,80,90,.15);
}
.tab.home .home-btn svg{width:22px;height:22px;stroke-width:1.8}
.tab.home span{margin-top:30px;color:var(--rose-deep);font-weight:600}
</style></head>
<body>
<div class="phone">

  <!-- 1 · Identity -->
  <div class="id-row">
    <div class="avatar" id="ava">
      <div class="cam" id="avaCam">
        <svg viewBox="0 0 24 24"><path d="M4 8.5h3l1.4-2h7.2L17 8.5h3v10H4z"/><circle cx="12" cy="13" r="3.1"/></svg>
      </div>
    </div>
    <div class="id-txt">
      <div class="id-name" id="nick" contenteditable="true" spellcheck="false">若愿</div>
      <div class="id-hint">Still becoming.</div>
    </div>
  </div>

  <!-- 2 · Traces -->
  <div class="sec">
    <div class="sec-l"><span class="en">Traces</span><span class="cn">痕迹</span></div>
  </div>
  <div class="card">
    <div class="mi-top">
      <div class="l">近七日念诵</div>
      <div class="tr-sum" id="weekSum"></div>
    </div>
    <div class="mi-bars" id="miBars"></div>
    <div class="mi-ax" id="miAx"></div>
    <div class="tr-empty" id="trEmpty" style="display:none">还没有念诵记录</div>
    <div class="bd-sp" id="bdSp"></div>
    <div id="boardList"></div>
  </div>

  <!-- 3 · Settings -->
  <div class="sec">
    <div class="sec-l"><span class="en">Settings</span><span class="cn">设置</span></div>
  </div>
  <div class="set">
    <div class="set-row" id="rowProfile">
      <span class="set-l">个人信息</span>
      <span class="set-v" id="vProfile">若愿</span>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="set-row" id="rowAccount">
      <span class="set-l">账号</span>
      <span class="set-v" id="vAccount">未登录</span>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="set-row" id="rowExport">
      <span class="set-l">导出备份</span>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </div>
    <div class="set-row" id="rowAbout">
      <span class="set-l">关于 Reverie</span>
      <span class="set-v">v0.1</span>
      <svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>
    </div>
  </div>

  <div style="height:26px"></div>
</div>

<input type="file" id="avaInput" accept="image/*" style="display:none"/>

<div class="mask" id="mask"></div>

<!-- 个人信息 -->
<div class="sheet" id="shProfile">
  <div class="sh-top">
    <span class="sh-cancel" data-close>取消</span>
    <span class="sh-ttl">个人信息</span>
    <button class="sh-ok" id="pfOk">保存</button>
  </div>
  <div class="sh-lb">Avatar 头像</div>
  <div class="sh-ava">
    <div class="pv" id="pfAva"></div>
    <div class="tip"><b id="pfPick">换一张</b><span id="pfDropWrap"> · <b id="pfDrop">移除</b></span><br>不传就是玫瑰渐变</div>
  </div>
  <div class="sh-lb">Name 昵称</div>
  <input class="sh-in" id="pfName" placeholder="昵称"/>
  <div style="height:6px"></div>
</div>

<!-- 账号 -->
<div class="sheet" id="shAccount">
  <div class="sh-top">
    <span class="sh-cancel" data-close>关闭</span>
    <span class="sh-ttl">账号</span>
    <span style="width:34px"></span>
  </div>
  <div id="acBody"></div>
</div>

<!-- 登录 / 注册 -->
<div class="sheet" id="shLogin">
  <div class="sh-top">
    <span class="sh-cancel" data-close>取消</span>
    <span class="sh-ttl" id="lgTtl">登录</span>
    <button class="sh-ok" id="lgOk">登录</button>
  </div>
  <div class="sh-lb">Email 邮箱</div>
  <input class="sh-in" id="lgMail" type="email" inputmode="email" autocomplete="username" placeholder="you@example.com"/>
  <div class="sh-lb">Password 密码</div>
  <input class="sh-in" id="lgPwd" type="password" autocomplete="current-password" placeholder="密码"/>
  <div class="ac-note">
    <span class="ac-do" id="lgSwitch">还没有账号？注册一个</span><br>
    <span class="ac-do" id="lgForgot">忘记密码</span>
  </div>
  <div style="height:6px"></div>
</div>

<div class="cfm" id="cfm">
  <div class="cfm-bd" id="cfmBd"></div>
  <div class="cfm-box">
    <div class="cfm-tx" id="cfmTx"></div>
    <div class="cfm-ops">
      <button class="cfm-op no" id="cfmNo">算了</button>
      <button class="cfm-op yes" id="cfmYes">确定</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="tabbar-wrap">
<nav class="tabbar">
  <div class="tab" onclick="location.href='affirm.html'"><div class="tab-ic">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65"><path d="M12 3.2c.7 4.5 2.3 6.1 6.8 6.8-4.5.7-6.1 2.3-6.8 6.8-.7-4.5-2.3-6.1-6.8-6.8 4.5-.7 6.1-2.3 6.8-6.8Z"/><path d="M18.5 15.2c.3 2 1 2.7 3 3-2 .3-2.7 1-3 3-.3-2-1-2.7-3-3 2-.3 2.7-1 3-3Z"/></svg>
  </div><span>肯定语</span></div>
  <div class="tab" onclick="location.href='gratitude.html'"><div class="tab-ic">

<script>
/* ===== 本地持久化 =====
   刷新、以及 iOS PWA 被系统回收内存后重开，都要能恢复。
   头像图一律压缩后再存（见 shrinkImage），localStorage 在 iOS 上只有 ~5MB。 */
const LS_KEY = 'reverie.me.v1';
let lsBlocked = false;
function lsSave(){
  if(lsBlocked) return;
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(dumpState()));
  }catch(e){
    lsBlocked = true;
    showToast('存不下了，换张小一点的图');
    setTimeout(()=>{ lsBlocked = false; }, 3000);
  }
}
function lsLoad(){
  let d;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    d = JSON.parse(raw);
  }catch(e){ return false; }
  if(!d || typeof d !== 'object') return false;
  try{ applyState(d); return true; }catch(e){ return false; }
}

/* 图片存前压到最长边 1080、WebP 质量 .82。
   相册原图 DataURL 动辄好几 MB，不压必然爆 localStorage。 */
function shrinkImage(dataURL, cb, maxPx, q){
  maxPx = maxPx || 1080; q = q || .82;
  const img = new Image();
  img.onload = ()=>{
    let w = img.width, h = img.height;
    const scale = Math.min(1, maxPx / Math.max(w, h));
    w = Math.max(1, Math.round(w*scale)); h = Math.max(1, Math.round(h*scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    let out = null;
    try{ out = c.toDataURL('image/webp', q); }catch(e){}
    if(!out || out.indexOf('data:image/webp') !== 0){
      try{ out = c.toDataURL('image/jpeg', q); }catch(e){ out = null; }
    }
    cb(out && out.length < dataURL.length ? out : dataURL);
  };
  img.onerror = ()=>cb(dataURL);
  img.src = dataURL;
}

/* ========== Data ========== */
const WD = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
/* 用户资料 */
let ME = { name:'若愿', avatar:null };
/* 账号 —— demo 阶段假的，接 Supabase 之前先把位子占对 */
let ACC = { mail:null };

function dumpState(){
  return { me: ME, acc: ACC };
}
function applyState(d){
  if(d.me && typeof d.me === 'object') ME = d.me;
  if(d.acc && typeof d.acc === 'object') ACC = d.acc;
}

/* ===== 念诵时长统计（affirm.html 的钟表写，这里只读） ===== */
const STATS_KEY = 'reverie.stats.v1';
/* 结构：
   {
     byBoard: { [boardKey]: { name:'财富金钱', mins:135 } },   // 沉浸念记在 '__immerse__'，name 是 '沉浸念'
     byDay:   { '2026-08-31': 42 }                            // 分钟，整数
   } */
function statsRead(){
  try{
    const d = JSON.parse(localStorage.getItem(STATS_KEY) || '{}');
    return { byBoard: d.byBoard || {}, byDay: d.byDay || {} };
  }catch(e){ return { byBoard:{}, byDay:{} }; }
}
function dayKey(t){
  return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
}
/* 近七日：从 byDay 里按真实日期取，最后一格是今天。没记录就是 0 */
function weekMins(){
  const byDay = statsRead().byDay;
  const out = [];
  for(let i=6;i>=0;i--){
    const t = new Date(); t.setDate(t.getDate()-i);
    out.push(byDay[dayKey(t)] || 0);
  }
  return out;
}
/* 板块累计 · 多的排前面 */
function boardStats(){
  return Object.values(statsRead().byBoard)
    .filter(b=>b && b.mins > 0)
    .sort((a,b)=>b.mins-a.mins);
}

/* ========== Helpers ========== */
function fmtMin(m){
  if(m < 60) return m + 'm';
  const h = Math.floor(m/60), r = m%60;
  return r ? h + 'h ' + r + 'm' : h + 'h';
}
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('on'), 1900);
}

/* ========== Confirm ========== */
const cfm = document.getElementById('cfm');
let cfmCb = null;
function ask(text, onYes){
  document.getElementById('cfmTx').textContent = text;
  cfmCb = onYes;
  cfm.classList.add('on');
}
function cfmClose(){ cfm.classList.remove('on'); cfmCb = null; }
document.getElementById('cfmNo').addEventListener('click',cfmClose);
document.getElementById('cfmBd').addEventListener('click',cfmClose);
document.getElementById('cfmYes').addEventListener('click',()=>{
  const cb = cfmCb; cfmClose(); if(cb) cb();
});

/* ========== Sheets ========== */
const mask = document.getElementById('mask');
let openSh = null;
function sheetOpen(id){
  sheetClose();
  openSh = document.getElementById(id);
  mask.classList.add('on');
  openSh.classList.add('on');
}
function sheetClose(){
  mask.classList.remove('on');
  if(openSh) openSh.classList.remove('on');
  openSh = null;
}
mask.addEventListener('click',sheetClose);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',sheetClose));
/* ========== 近七日迷你柱 ========== */
function renderMini(){
  const bars = document.getElementById('miBars');
  const ax = document.getElementById('miAx');
  const empty = document.getElementById('trEmpty');
  bars.innerHTML = ''; ax.innerHTML = '';
  const WEEK = weekMins();
  const total = WEEK.reduce((a,b)=>a+b,0);
  /* 七天一条记录都没有：柱子全贴地既难看又莫名，直接换空态 */
  if(total === 0){
    bars.style.display = 'none';
    ax.style.display = 'none';
    empty.style.display = 'block';
    document.getElementById('weekSum').textContent = '';
    return;
  }
  bars.style.display = 'grid';
  ax.style.display = 'grid';
  empty.style.display = 'none';
  const max = Math.max(...WEEK, 1);
  const H = 40, todayIdx = WEEK.length - 1;
  const startWd = (new Date().getDay() - 6 + 14) % 7;
  WEEK.forEach((v,i)=>{
    const b = document.createElement('div');
    b.className = 'mi-bar' + (i===todayIdx?' today':'') + (v===0?' zero':'');
    b.style.height = (v > 0 ? Math.max(Math.round(v/max*H),4) : 3) + 'px';
    bars.appendChild(b);
    const d = document.createElement('div');
    d.textContent = WD[(startWd + i) % 7];
    if(i===todayIdx) d.className = 'today';
    ax.appendChild(d);
  });
  document.getElementById('weekSum').textContent = fmtMin(total);
}

/* ========== 板块累计 ========== */
function renderBoards(){
  const wrap = document.getElementById('boardList');
  wrap.innerHTML = '';
  const list = boardStats();
  if(!list.length){
    /* 整张卡都空的时候，上面那句"还没有念诵记录"就够了，别再重复一遍 */
    const bare = weekMins().every(v=>v===0);
    document.getElementById('bdSp').style.display = bare ? 'none' : 'block';
    wrap.innerHTML = bare ? '' : '<div class="tr-empty">还没有板块记录</div>';
    return;
  }
  document.getElementById('bdSp').style.display = 'block';
  const max = Math.max(...list.map(b=>b.mins), 1);
  list.forEach(b=>{
    const pct = Math.max(Math.round(b.mins/max*100), 4);
    const row = document.createElement('div');
    row.className = 'bd-row';
    row.innerHTML =
      '<div class="bd-name">' + esc(b.name) + '</div>' +
      '<div class="bd-track"><div class="bd-fill" style="width:' + pct + '%"></div></div>' +
      '<div class="bd-time">' + fmtMin(b.mins) + '</div>';
    wrap.appendChild(row);
  });
}

/* ========== 头像 + 昵称 ========== */
const avaInput = document.getElementById('avaInput');
function paintAvatar(){
  const on = !!ME.avatar;
  document.getElementById('ava').style.backgroundImage = on ? `url(${ME.avatar})` : '';
  document.getElementById('avaCam').style.display = on ? 'none' : 'grid';
  document.getElementById('pfAva').style.backgroundImage = on ? `url(${ME.avatar})` : '';
  document.getElementById('pfDropWrap').style.display = on ? 'inline' : 'none';
}
function paintName(){
  document.getElementById('nick').textContent = ME.name;
  document.getElementById('vProfile').textContent = ME.name;
}
avaInput.addEventListener('change',e=>{
  const f = (e.target.files||[])[0];
  avaInput.value = '';
  if(!f) return;
  const r = new FileReader();
  r.onload = ev=>{
    /* 头像就 58px 显示，512 够用了，压小点省 localStorage */
    shrinkImage(ev.target.result, out=>{
      ME.avatar = out; paintAvatar(); lsSave(); showToast('头像换好了');
    }, 512, .85);
  };
  r.readAsDataURL(f);
});
document.getElementById('ava').addEventListener('click',()=>avaInput.click());
document.getElementById('pfPick').addEventListener('click',()=>avaInput.click());
document.getElementById('pfDrop').addEventListener('click',()=>{
  ask('把头像换回玫瑰渐变？',()=>{ ME.avatar = null; paintAvatar(); lsSave(); showToast('头像已移除'); });
});

/* 首页那个昵称直接改，回车即存 */
const nick = document.getElementById('nick');
nick.addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); nick.blur(); } });
nick.addEventListener('blur',()=>{
  const v = (nick.textContent||'').trim();
  if(!v){ paintName(); showToast('名字不能空着'); return; }
  ME.name = v; paintName(); lsSave();
});

/* ========== 个人信息抽屉 ========== */
document.getElementById('rowProfile').addEventListener('click',()=>{
  document.getElementById('pfName').value = ME.name;
  paintAvatar();
  sheetOpen('shProfile');
});
document.getElementById('pfAva').addEventListener('click',()=>avaInput.click());
document.getElementById('pfOk').addEventListener('click',()=>{
  const v = document.getElementById('pfName').value.trim();
  if(!v){ showToast('名字不能空着'); return; }
  ME.name = v; paintName(); lsSave(); sheetClose(); showToast('已保存');
});
/* ========== 账号 ==========
   demo 阶段全是假的，只把位子和流程占对。真接的时候换成 Supabase：
   signUp / signInWithPassword / resetPasswordForEmail / signOut。
   注销账号必须有（苹果硬要求），删数据要走服务端。 */
function renderAccount(){
  const body = document.getElementById('acBody');
  if(!ACC.mail){
    body.innerHTML = `
      <div class="ac-tip">登录后数据会同步到云端，换手机也在。</div>
      <button class="sh-ok" style="width:100%;padding:12px 0" data-ac="login">邮箱登录 / 注册</button>
      <div class="ac-note">现在写的东西只存在这台手机上。</div>
      <div style="height:6px"></div>`;
  } else {
    body.innerHTML = `
      <div class="ac-row"><span class="ac-l">邮箱</span><span class="ac-v">${esc(ACC.mail)}</span></div>
      <div class="ac-row"><span class="ac-l">修改密码</span><span class="ac-do" data-ac="pwd">改</span></div>
      <div class="ac-row"><span class="ac-l">退出登录</span><span class="ac-do" data-ac="out">退出</span></div>
      <div class="ac-row"><span class="ac-l">注销账号</span><span class="ac-do warn" data-ac="kill">注销</span></div>
      <div class="ac-note">注销会把云端的日记、剧本、肯定语一起删掉，找不回来。</div>
      <div style="height:6px"></div>`;
  }
  body.querySelectorAll('[data-ac]').forEach(b=>{
    b.addEventListener('click',()=>{
      const a = b.dataset.ac;
      if(a==='login'){ lgMode = 'in'; paintLogin(); sheetOpen('shLogin'); }
      else if(a==='pwd'){ showToast('接后端后走邮件重置'); }
      else if(a==='out'){
        ask('退出登录？本机的数据还在。',()=>{
          ACC.mail = null; paintAccount(); renderAccount(); lsSave(); sheetClose(); showToast('已退出');
        });
      }
      else if(a==='kill'){
        ask('注销账号？云端所有内容一起删掉，找不回来。',()=>{
          ACC.mail = null; paintAccount(); renderAccount(); lsSave(); sheetClose(); showToast('已注销');
        });
      }
    });
  });
}
function paintAccount(){
  document.getElementById('vAccount').textContent = ACC.mail || '未登录';
}
document.getElementById('rowAccount').addEventListener('click',()=>{
  renderAccount(); sheetOpen('shAccount');
});

/* 登录 / 注册 —— 同一张抽屉两个模式 */
let lgMode = 'in';
function paintLogin(){
  const up = lgMode === 'up';
  document.getElementById('lgTtl').textContent = up ? '注册' : '登录';
  document.getElementById('lgOk').textContent = up ? '注册' : '登录';
  document.getElementById('lgSwitch').textContent = up ? '已经有账号了？去登录' : '还没有账号？注册一个';
  document.getElementById('lgForgot').style.display = up ? 'none' : 'inline';
  document.getElementById('lgPwd').setAttribute('autocomplete', up ? 'new-password' : 'current-password');
}
document.getElementById('lgSwitch').addEventListener('click',()=>{ lgMode = lgMode==='up'?'in':'up'; paintLogin(); });
document.getElementById('lgForgot').addEventListener('click',()=>{
  const m = document.getElementById('lgMail').value.trim();
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){ showToast('先填邮箱，重置链接发到那儿'); return; }
  showToast('重置链接已发出（接后端后生效）');
});
document.getElementById('lgOk').addEventListener('click',()=>{
  const m = document.getElementById('lgMail').value.trim();
  const p = document.getElementById('lgPwd').value;
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(m)){ showToast('邮箱格式不对'); return; }
  if(p.length < 6){ showToast('密码至少 6 位'); return; }
  ACC.mail = m;
  paintAccount(); renderAccount(); lsSave();
  document.getElementById('lgPwd').value = '';
  sheetOpen('shAccount');
  showToast(lgMode==='up' ? '注册好了（demo 假的）' : '登录成功（demo 假的）');
});

/* ========== 导出备份 / 关于 ========== */
document.getElementById('rowExport').addEventListener('click',()=>{
  /* 除了看得懂的统计，把 reverie.* 的原始存档也一并带上，换手机能整个搬走 */
  const raw = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(k && k.indexOf('reverie.') === 0) raw[k] = localStorage.getItem(k);
  }
  const s = statsRead();
  const data = {
    me: ME,
    acc: ACC,
    week: weekMins(),
    boards: boardStats(),
    byDay: s.byDay,
    raw: raw,
    exportedAt: new Date().toISOString()
  };
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'reverie-backup-' + dayKey(new Date()) + '.json';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 1500);
  showToast('备份已导出');
});
document.getElementById('rowAbout').addEventListener('click',()=>{
  showToast('Reverie · 灵思絮语 v0.1');
});

/* ========== Init ========== */
lsLoad();
renderMini();
renderBoards();
paintAvatar();
paintName();
paintAccount();
paintLogin();

/* 从肯定语那页念完回来，图表得跟着刷新（bfcache 里回来不会重新执行上面那些） */
window.addEventListener('pageshow',e=>{ if(e.persisted){ renderMini(); renderBoards(); } });
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden){ renderMini(); renderBoards(); }
});
</script>

/* PWA —— 装到桌面用。file:// 下不注册（协议不支持），只在 http/https 生效 */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
