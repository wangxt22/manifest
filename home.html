<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#FFF3F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Reverie">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<title>Reverie · 灵思絮语</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#FFF9FC;
  --bg-2:#FBF1F4;

  /* 背景可替换：如果想换成 PNG，把下面的 --bg-image 改成 url('xxx.png')
     或用内联 style="--bg-image:url('./bg.png')" 覆盖即可 */
  --bg-image:none;
  --bg-gradient:
    radial-gradient(1200px 800px at 15% -10%,#F5CDDB 0%,transparent 55%),
    radial-gradient(1000px 700px at 100% 100%,#F6D5DE 0%,transparent 60%),
    #FFF3F7;

  --surface:rgba(255,253,254,.88);
  --surface-solid:#FFFCFD;
  --pearl:#F1E3E8;
  --rose:#D4A5B0;
  --rose-deep:#A87682;
  --gold:#C9A87A;
  --t1:#5A3D4A;
  --t2:#8B6B7A;
  --t3:#B89AAA;
  --serif-en:'Cormorant Garamond',serif;
  --sans-en:'Inter',-apple-system,sans-serif;
  --serif-cn:'Noto Serif SC',serif;
  --sans-cn:-apple-system,'PingFang SC',sans-serif;
  --r-card:20px;
  --r-pill:999px;
  --r-input:14px;
  --r-icon:10px;
  --shadow-card:0 6px 24px rgba(180,120,130,.14),inset 0 1px 0 rgba(255,255,255,.9);
  --shadow-float:0 12px 40px rgba(160,100,110,.18);
  --line:.5px solid rgba(255,255,255,.7);
}
html{height:100%}
body{
  font-family:var(--sans-cn);color:var(--t1);font-size:15px;
  background-color:#FFF3F7;
  background-image:var(--bg-image),var(--bg-gradient);
  background-size:cover;
  background-position:center;
  background-attachment:fixed;
  background-repeat:no-repeat;
  min-height:100%;overflow-x:hidden;
  /* 底 tabbar 是 fixed 的，首页那个球还往上凸 22px —— 留够，别让内容被压在底下 */
  padding-bottom:calc(118px + env(safe-area-inset-bottom));
}

/* ===== Phone frame (for desktop preview only) ===== */
.phone{
  max-width:420px;margin:0 auto;position:relative;
  padding:0 20px;padding-top:calc(env(safe-area-inset-top,20px) + 8px);
}

/* ===== Section title ===== */
.sec{
  display:flex;align-items:baseline;justify-content:space-between;
  margin:18px 4px 12px;
}
.sec:first-of-type{margin-top:8px}
.sec-l{display:flex;align-items:baseline;gap:8px}
.sec-l .en{font-family:var(--serif-en);font-size:20px;font-weight:500;color:var(--t1);font-style:italic;letter-spacing:.4px}
.sec-l .cn{font-family:var(--serif-cn);font-size:11px;color:var(--t2);letter-spacing:2px;margin-left:2px}
.sec-r{font-size:11px;color:var(--rose-deep);letter-spacing:1px;cursor:pointer;font-family:var(--sans-en);font-weight:500}

/* ===== Glass card ===== */
.card{
  background:var(--surface);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-card);
  box-shadow:var(--shadow-card);
  padding:20px;position:relative;overflow:hidden;
}
.card + .card{margin-top:14px}

/* ===== Affirmation card ===== */
.aff{padding:24px 22px 22px;text-align:center;position:relative}
.aff .label{font-size:10px;color:var(--t3);letter-spacing:3px;font-family:var(--sans-en);font-weight:500;text-transform:uppercase}
.aff .quote{
  font-family:var(--serif-cn);font-weight:500;font-size:17px;line-height:1.9;
  color:var(--t1);margin:10px 0 12px;
  /* 用 textContent + pre-line 渲染换行 —— 不拼 innerHTML，用户打什么都不会变成标签 */
  white-space:pre-line;
}
.aff .sub{
  font-family:var(--serif-en);font-style:italic;font-size:13px;color:var(--rose-deep);
}
/* 肯定语可以直接在卡上改 —— 光标进来的时候给一点底，让人知道这里能动 */
.aff [contenteditable]{outline:none;border-radius:8px;padding:0 6px}
.aff [contenteditable]:focus{background:rgba(212,165,176,.10)}
.aff::before,.aff::after{
  content:'';position:absolute;width:60px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);
  opacity:.6;left:50%;transform:translateX(-50%);
}
.aff::before{top:52px}
.aff::after{bottom:52px}

/* ===== Ritual entry card (→ affirm.html) ===== */
.ritual-entry{
  display:flex;align-items:center;gap:14px;
  padding:16px 18px;cursor:pointer;transition:transform .15s;
}
.ritual-entry:active{transform:scale(.985)}
.re-txt{flex:1;min-width:0}
.re-en{
  font-family:var(--serif-en);font-style:italic;font-size:13px;
  color:var(--rose-deep);letter-spacing:.6px;display:block;line-height:1.2;
}
.re-cn{
  font-family:var(--serif-cn);font-weight:600;font-size:16.5px;
  color:var(--t1);letter-spacing:1px;margin-top:4px;
}
.re-sub{
  font-size:11.5px;color:var(--t3);letter-spacing:.3px;
  line-height:1.6;margin-top:5px;
}
.re-go{
  flex:0 0 auto;width:40px;height:40px;border-radius:50%;
  background:linear-gradient(135deg,var(--rose) 0%,var(--rose-deep) 100%);
  display:grid;place-items:center;
  box-shadow:
    0 4px 12px rgba(168,118,130,.32),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(120,70,80,.15);
}
.re-go svg{
  width:18px;height:18px;fill:none;stroke:#fff;stroke-width:1.65;
  stroke-linecap:round;stroke-linejoin:round;
}

/* ===== Todo card ===== */
.todo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.todo-head .t{font-family:var(--serif-en);font-size:15px;font-style:italic;color:var(--t1)}
.todo-head .t .cn{font-family:var(--serif-cn);font-style:normal;font-size:11px;color:var(--t2);margin-left:6px;letter-spacing:2px}
/* 一条都没有的时候，卡头左边就放那句空态，别空着一块 */
.todo-head .t.none{font-family:var(--sans-cn);font-style:normal;font-size:13px;color:var(--t3);letter-spacing:.3px}

/* Release — 玫瑰渐变胶囊按钮，放在 Todo 卡头右侧 */
.release-btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px 7px 12px;border-radius:var(--r-pill);
  background:linear-gradient(135deg,var(--rose) 0%,var(--rose-deep) 100%);
  color:#fff;font-size:12.5px;font-family:var(--sans-cn);font-weight:500;
  letter-spacing:1px;cursor:pointer;border:none;
  box-shadow:
    0 4px 12px rgba(168,118,130,.32),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(120,70,80,.15);
  transition:transform .15s;
}
.release-btn:active{transform:scale(.96)}
.release-btn svg{width:14px;height:14px;stroke-width:1.5}

.todo{
  display:flex;align-items:center;gap:12px;
  padding:11px 0;border-top:.5px solid var(--pearl);
}
.todo:first-of-type{border-top:none;padding-top:4px}
.chk{
  width:19px;height:19px;border-radius:50%;flex-shrink:0;
  border:1.3px solid var(--t3);background:transparent;cursor:pointer;
  display:grid;place-items:center;transition:all .2s;
}
.chk.done{border-color:var(--rose);background:var(--rose)}
.chk.done::after{content:'';width:8px;height:4px;border-left:1.5px solid #fff;border-bottom:1.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.todo .txt{flex:1;font-size:14px;color:var(--t1)}
.todo.done .txt{color:var(--t3);text-decoration:line-through}
/* 删除是次要动作，做小、放右边，但别做成灰按钮 */
.todo .del{
  flex:0 0 auto;width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  color:var(--t3);background:transparent;border:none;transition:all .18s;
}
.todo .del:active{background:rgba(212,165,176,.16);color:var(--rose-deep)}
.todo .del svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
.add-row{
  display:flex;align-items:center;gap:8px;padding-top:12px;margin-top:6px;
  border-top:.5px dashed var(--pearl);
  color:var(--t3);font-size:12px;cursor:pointer;
}
.add-row svg{width:14px;height:14px}
/* 点了加号才出来的输入行 */
.add-form{
  display:none;align-items:center;gap:8px;padding-top:12px;margin-top:6px;
  border-top:.5px dashed var(--pearl);
}
.add-form.on{display:flex}
.add-form input{
  flex:1;min-width:0;border:1px solid rgba(255,255,255,.85);
  background:rgba(255,255,255,.62);border-radius:var(--r-input);
  padding:9px 12px;font-size:14px;color:var(--t1);
  font-family:var(--sans-cn);outline:none;
}
.add-form input::placeholder{color:var(--t3)}
.add-form input:focus{border-color:rgba(212,165,176,.55)}
.add-ok{
  flex:0 0 auto;padding:9px 15px;border-radius:var(--r-pill);border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--rose) 0%,var(--rose-deep) 100%);
  color:#fff;font-size:12.5px;font-family:var(--sans-cn);font-weight:500;letter-spacing:1px;
  box-shadow:
    0 4px 12px rgba(168,118,130,.32),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(120,70,80,.15);
  transition:transform .15s;
}
.add-ok:active{transform:scale(.96)}

/* ===== Theater (timeline) card ===== */
/* 多部剧本同时在演 → 横向滑卡，一次只露一部 */
.th-wrap{
  display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;
  scrollbar-width:none;padding-bottom:2px;
}
.th-wrap::-webkit-scrollbar{display:none}
.th-wrap > .card{flex:0 0 100%;scroll-snap-align:start;margin-top:0}
.th-ind{display:flex;justify-content:center;gap:5px;margin-top:10px}
.th-ind i{width:5px;height:5px;border-radius:50%;background:rgba(212,165,176,.32);transition:all .25s}
.th-ind i.on{width:16px;border-radius:3px;background:var(--rose-deep)}
.sec-r.count{color:var(--t3);font-family:var(--sans-en)}
/* Cormorant 老式数字会把 1 写成小写 I，数字位强制 lining */
.day-badge,.tl-dot,.scene .lead,.todo-head .t,.day-badge{font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1,"onum" 0}
.theater-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.theater-title{font-family:var(--serif-en);font-size:16px;font-style:italic;color:var(--t1)}
.theater-title .cn{font-family:var(--serif-cn);font-style:normal;font-size:12px;color:var(--t2);margin-left:6px;letter-spacing:1.5px}
.day-badge{
  font-family:var(--sans-en);font-size:11px;font-weight:500;letter-spacing:1px;
  color:var(--rose-deep);padding:3px 10px;border-radius:var(--r-pill);
  background:rgba(212,165,176,.14);
}
.timeline{
  position:relative;padding:6px 0 4px;margin:8px 2px 14px;
}
.timeline::before{
  content:'';position:absolute;left:12px;right:12px;top:50%;height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--pearl) 15%,var(--pearl) 85%,transparent 100%);
  transform:translateY(-50%);
}
.tl-row{display:flex;justify-content:space-between;position:relative;z-index:1}
.tl-dot{
  width:26px;height:26px;border-radius:50%;
  display:grid;place-items:center;
  background:var(--surface-solid);
  border:1px solid var(--pearl);
  font-family:var(--serif-en);font-size:11px;color:var(--t3);font-weight:500;
}
.tl-dot.done{background:rgba(212,165,176,.12);border-color:rgba(212,165,176,.35);color:var(--rose-deep)}
.tl-dot.cur{
  background:linear-gradient(145deg,var(--rose),var(--rose-deep));
  border-color:transparent;color:#fff;
  box-shadow:0 3px 10px rgba(168,118,130,.35);
  width:30px;height:30px;font-weight:600;
}
.tl-dot.done::after{
  content:'';position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--rose);transform:translate(11px,-10px);
}
.scene{
  font-family:var(--serif-cn);font-weight:500;
  font-size:14px;line-height:1.85;color:var(--t1);
  padding:14px 4px 4px;
  position:relative;
}
.scene + .scene{padding-top:14px;margin-top:10px;border-top:.5px dashed rgba(212,165,176,.35)}
.scene::before{
  content:'';position:absolute;left:0;top:14px;bottom:4px;width:2px;
  background:linear-gradient(180deg,var(--rose),transparent);
  border-radius:2px;opacity:.55;
}
.scene-inner{padding-left:14px}
.scene .lead{font-family:var(--serif-en);font-style:italic;font-size:12px;color:var(--rose-deep);letter-spacing:.5px;margin-bottom:4px;display:block}
.scene .lead .cn{font-family:var(--serif-cn);font-style:normal;font-size:10.5px;color:var(--t3);margin-left:5px;letter-spacing:1px}
/* 一幕可以写很长 —— 首页只露两行，全文去剧本页看 */
.scene .txt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* 那天还没写字的幕，也照样占一行，不要渲染成空白 */
.scene .txt.empty{color:var(--t3)}
/* 一部在演的都没有 —— 给句话 + 一个去挑剧本的口子，不藏整块 */
.th-empty{text-align:center;padding:26px 18px}
.th-empty .en{
  font-family:var(--serif-en);font-style:italic;font-size:15px;
  color:var(--rose-deep);letter-spacing:.5px;display:block;
}
.th-empty .cn{font-size:13px;color:var(--t3);line-height:1.75;margin-top:6px;display:block}
.th-empty .go{
  display:inline-flex;align-items:center;gap:6px;margin-top:16px;
  padding:9px 17px;border-radius:var(--r-pill);border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--rose) 0%,var(--rose-deep) 100%);
  color:#fff;font-size:12.5px;font-family:var(--sans-cn);font-weight:500;letter-spacing:1px;
  box-shadow:
    0 4px 12px rgba(168,118,130,.32),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -1px 0 rgba(120,70,80,.15);
  transition:transform .15s;
}
.th-empty .go:active{transform:scale(.96)}
.th-empty .go svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 一天超过两幕时，多的收起来 */
.th-more{
  margin-top:13px;padding-top:11px;border-top:.5px dashed rgba(212,165,176,.35);
  font-size:11.5px;color:var(--rose-deep);letter-spacing:.5px;
  display:flex;align-items:center;gap:5px;cursor:pointer;
}
.th-more svg{width:11px;height:11px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}

/* ===== TabBar — floating pill with center-raised Home ===== */
.tabbar-wrap{
  position:fixed;left:0;right:0;bottom:0;
  padding:0 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;justify-content:center;pointer-events:none;
  z-index:100;
}
.tabbar{
  position:relative;pointer-events:auto;
  width:100%;max-width:396px;
  padding:6px 10px;
  background:rgba(255,253,254,.78);
  backdrop-filter:blur(40px) saturate(180%);
  -webkit-backdrop-filter:blur(40px) saturate(180%);
  border:1px solid rgba(255,255,255,.85);
  border-radius:var(--r-pill);
  box-shadow:
    0 12px 32px rgba(180,120,130,.22),
    0 2px 6px rgba(180,120,130,.10),
    inset 0 1px 0 rgba(255,255,255,.9);
  display:flex;justify-content:space-between;align-items:center;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:2px 2px;color:var(--t3);cursor:pointer;
  transition:color .2s;
}
.tab.on{color:var(--rose-deep)}
.tab-ic{
  width:28px;height:24px;display:grid;place-items:center;
}
.tab svg{width:21px;height:21px;stroke-linecap:round;stroke-linejoin:round}
.tab span{font-size:10px;letter-spacing:.5px;font-family:var(--sans-cn);font-weight:500}

/* Center-raised Home tab — rose color, no white ring */
.tab.home{
  position:relative;flex:0 0 auto;width:60px;
}
.tab.home .home-btn{
  position:absolute;left:50%;top:-22px;transform:translateX(-50%);
  width:50px;height:50px;border-radius:50%;
  background:var(--rose);
  display:grid;place-items:center;color:#fff;
  box-shadow:
    0 8px 18px rgba(200,140,150,.42),
    0 2px 5px rgba(200,140,150,.22),
    inset 0 1px 0 rgba(255,255,255,.35),
    inset 0 -2px 4px rgba(140,80,90,.15);
}
.tab.home .home-btn svg{width:22px;height:22px;stroke-width:1.8}
.tab.home span{margin-top:30px;color:var(--rose-deep);font-weight:600}
</style></head>
<body>
<div class="phone">

  <!-- Section: Affirmation -->
  <div class="sec">
    <div class="sec-l">
      <span class="en">Daily Affirmation</span>
      <span class="cn">每日肯定语</span>
    </div>
  </div>

  <div class="card aff">
    <div class="label">TODAY'S WORD</div>
    <div class="quote" id="affQuote" contenteditable="true"></div>
    <div class="sub" id="affSub" contenteditable="true"></div>
  </div>

  <!-- Ritual entry → affirm.html -->
  <div class="card ritual-entry" onclick="location.href='affirm.html'">
    <div class="re-txt">
      <span class="re-en">Begin the Ritual</span>
      <div class="re-cn">开始今日仪式</div>
      <div class="re-sub">找一个安静的时刻，把今天的句子念给自己</div>
    </div>
    <div class="re-go">
      <svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M12.5 6.5 19 12l-6.5 5.5"/></svg>
    </div>
  </div>

  <!-- Section: Todo -->
  <div class="sec">
    <div class="sec-l">
      <span class="en">Today's Ritual</span>
      <span class="cn">今日待办</span>
    </div>
  </div>

  <div class="card">
    <div class="todo-head">
      <div class="t" id="todoCount"></div>
      <button class="release-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.5 3.5c-4 0-8 2-11 5s-5 7-5 11l16-16Z"/>
          <path d="M4.5 19.5 12 12"/>
          <path d="M15 6l3 3"/>
          <path d="M12 9l3 3"/>
          <path d="M9 12l3 3"/>
        </svg>
        <span>释放</span>
      </button>
    </div>
    <div id="todoList"></div>
    <div class="add-row" id="addRow">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>添加新的今日事</span>
    </div>
    <div class="add-form" id="addForm">
      <input id="addInput" type="text" placeholder="今天想做的一件事" autocomplete="off">
      <button class="add-ok" id="addOk">添加</button>
    </div>
  </div>

  <!-- Section: Theater -->
  <div class="sec">
    <div class="sec-l">
      <span class="en">Today's Theater</span>
      <span class="cn">今日剧场</span>
    </div>
    <div class="sec-r count" id="thCount"></div>
  </div>

  <!-- 多部在演 → 左右滑切剧本；7 个点跟着今天自动切周，不用手滑 -->
  <div class="th-wrap" id="thWrap"></div>
  <div class="th-ind" id="thInd"></div>


  <!-- spacer -->
  <div style="height:20px"></div>
</div>

<!-- TabBar -->
<div class="tabbar-wrap">

<script>
/* ===== 本地持久化 =====
   刷新、以及 iOS PWA 被系统回收内存后重开，都要能恢复。 */
const LS_KEY = 'reverie.home.v1';
let lsBlocked = false;
function lsSave(){
  if(lsBlocked) return;
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(dumpState()));
  }catch(e){
    /* 首页存的都是纯文本，几乎不可能存满。真存不下就静默，冷却 3 秒 */
    lsBlocked = true;
    setTimeout(()=>{ lsBlocked = false; }, 3000);
  }
}
function lsLoad(){
  let d;
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(!raw) return false;
    d = JSON.parse(raw);
  }catch(e){ return false; }   /* 数据坏了就当没存过，不能让整页挂掉 */
  if(!d || typeof d !== 'object') return false;
  try{ applyState(d); return true; }catch(e){ return false; }
}

/* ===== 剧本（script.html 存的，这里只读） ===== */
function scriptsRead(){
  try{
    const d = JSON.parse(localStorage.getItem('reverie.script.v1') || '{}');
    return Array.isArray(d.scripts) ? d.scripts : [];
  }catch(e){ return []; }
}

/* ===== State ===== */
/* 首页待办。用户自己加、自己勾、自己删 —— 存本地，刷新还在 */
let TODOS = [];   // [{ txt:'…', done:false }]
/* 肯定语。默认那句是产品自带文案，用户可以直接在卡上改 */
let AFF = { txt:'你的一切愿望\n都已在来的路上', sub:'Still becoming.' };

function dumpState(){ return { todos: TODOS, aff: AFF }; }
function applyState(d){
  if(Array.isArray(d.todos)) TODOS = d.todos;
  if(d.aff && typeof d.aff === 'object') AFF = d.aff;
}

/* ===== 每日肯定语 ===== */
/* 换行一律用 \n 存，渲染靠 textContent + CSS white-space:pre-line —— 不拼 innerHTML */
function renderAff(){
  const q = document.getElementById('affQuote');
  const sb = document.getElementById('affSub');
  q.textContent = AFF.txt || '';
  sb.textContent = AFF.sub || '';
}
function bindAff(){
  const q = document.getElementById('affQuote');
  const sb = document.getElementById('affSub');
  /* contenteditable 里回车会插 <div>，所以取值一律读 innerText 再规整成 \n */
  const grab = el => el.innerText.replace(/\r/g,'').replace(/\n{3,}/g,'\n\n').replace(/^\n+|\n+$/g,'');
  q.addEventListener('blur',()=>{
    const v = grab(q);
    AFF.txt = v;
    renderAff();
    lsSave();
  });
  sb.addEventListener('blur',()=>{
    AFF.sub = grab(sb).replace(/\n/g,' ');
    renderAff();
    lsSave();
  });
}

/* ===== 今日待办 ===== */
function renderTodos(){
  const host = document.getElementById('todoList');
  const cnt = document.getElementById('todoCount');
  host.innerHTML = '';
  const n = TODOS.length;
  const doneN = TODOS.filter(t=>t.done).length;
  cnt.innerHTML = '';
  cnt.className = 't' + (n ? '' : ' none');
  if(n){
    /* 「2 things 今日 2 项 · 已完成 1」—— 数字都是真的 */
    cnt.appendChild(document.createTextNode(n + (n>1?' things':' thing')));
    const cn = document.createElement('span');
    cn.className = 'cn';
    cn.textContent = '今日 ' + n + ' 项' + (doneN ? ' · 已完成 ' + doneN : '');
    cnt.appendChild(cn);
  } else {
    cnt.textContent = '今天还没有安排';
    return;
  }
  TODOS.forEach((t,i)=>{
    const row = document.createElement('div');
    row.className = 'todo' + (t.done ? ' done' : '');
    const chk = document.createElement('div');
    chk.className = 'chk' + (t.done ? ' done' : '');
    chk.addEventListener('click',()=>{ TODOS[i].done = !TODOS[i].done; renderTodos(); lsSave(); });
    const txt = document.createElement('div');
    txt.className = 'txt';
    txt.textContent = t.txt;                       /* 用户输入只走 textContent */
    const del = document.createElement('button');
    del.className = 'del';
    del.setAttribute('aria-label','删除这一项');
    del.innerHTML = '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg>';
    del.addEventListener('click',()=>{ TODOS.splice(i,1); renderTodos(); lsSave(); });
    row.appendChild(chk); row.appendChild(txt); row.appendChild(del);
    host.appendChild(row);
  });
}
function bindTodos(){
  const row = document.getElementById('addRow');
  const form = document.getElementById('addForm');
  const inp = document.getElementById('addInput');
  const ok = document.getElementById('addOk');
  function openForm(){
    row.style.display = 'none';
    form.classList.add('on');
    inp.value = '';
    inp.focus();
  }
  function closeForm(){
    form.classList.remove('on');
    row.style.display = 'flex';
  }
  function commit(){
    const v = inp.value.trim();
    if(!v){ closeForm(); return; }
    TODOS.push({ txt:v, done:false });
    renderTodos();
    lsSave();
    /* 加完接着让人加下一条，省一次点击 */
    inp.value = '';
    inp.focus();
  }
  row.addEventListener('click',openForm);
  ok.addEventListener('click',commit);
  inp.addEventListener('keydown',e=>{
    if(e.key === 'Enter'){ e.preventDefault(); commit(); }
    else if(e.key === 'Escape'){ closeForm(); }
  });
  inp.addEventListener('blur',()=>{ if(!inp.value.trim()) closeForm(); });
}

/* ===== 今日剧场 ===== */
const TH_ACT_MAX = 2;      /* 首页一张卡最多铺 2 幕，其余收成「还有 n 幕」 */
function esc(t){
  return String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function kOf(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function parseK(k){const [y,m,d]=String(k).split('-').map(Number);return new Date(y,m-1,d)}
/* 自然日计天：从开启那天算起，中间没写也照样往前走，不能暂停 */
function dayN(s){
  if(!s.startDate) return 0;
  return Math.floor((parseK(kOf(new Date())) - parseK(s.startDate))/864e5) + 1;
}
/* 首页只露 7 天：按当前天所在那一周切窗口，横滑留给换剧本 */
function weekWin(s){
  const n = dayN(s);
  const wi = Math.floor((n-1)/7);
  const from = wi*7 + 1;
  return {from, to: Math.min(from+6, s.days), wi: wi+1, total: Math.ceil(s.days/7)};
}

function renderTheater(){
  const wrap = document.getElementById('thWrap');
  const ind = document.getElementById('thInd');
  const cnt = document.getElementById('thCount');
  /* 只认正在演的，而且天数还没跑完的 —— 演完的不该占着今日剧场 */
  const list = scriptsRead().filter(s=>{
    if(!s || s.state !== 'playing' || !s.startDate) return false;
    const n = dayN(s);
    return n >= 1 && n <= (s.days || 0);
  });
  wrap.innerHTML = '';
  ind.innerHTML = '';
  cnt.textContent = list.length ? list.length + ' 部在演' : '';
  if(!list.length){
    const card = document.createElement('div');
    card.className = 'card th-empty';
    card.innerHTML = `
      <span class="en">Nothing playing.</span>
      <span class="cn">还没有在演的剧本</span>
      <button class="go">去挑一个<svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M12.5 6.5 19 12l-6.5 5.5"/></svg></button>`;
    card.querySelector('.go').addEventListener('click',()=>{ location.href='script.html'; });
    wrap.appendChild(card);
    return;
  }
  list.forEach(s=>{
    const n = dayN(s);
    const w = weekWin(s);
    let dots = '';
    for(let d=w.from; d<=w.to; d++){
      const cls = d < n ? ' done' : (d === n ? ' cur' : '');
      dots += `<div class="tl-dot${cls}">${d}</div>`;
    }
    const acts = Array.isArray((s.acts||{})[n]) ? s.acts[n] : [];
    let scenes = '';
    acts.slice(0,TH_ACT_MAX).forEach((t,i)=>{
      const blank = !t || !String(t).trim();
      scenes += `<div class="scene"><div class="scene-inner">
        <span class="lead">Act ${i+1}<span class="cn">第 ${i+1} 幕</span></span>
        <div class="txt${blank?' empty':''}">${blank?'今天还没写':esc(t)}</div>
      </div></div>`;
    });
    /* 那天一幕都没有，也要有一行占位，不要渲染成空白卡 */
    if(!acts.length){
      scenes = `<div class="scene"><div class="scene-inner">
        <span class="lead">Act 1<span class="cn">第 1 幕</span></span>
        <div class="txt empty">今天还没写</div>
      </div></div>`;
    }
    const extra = Math.max(acts.length - TH_ACT_MAX, 0);
    const more = extra > 0
      ? `<div class="th-more"><span>还有 ${extra} 幕</span><svg viewBox="0 0 24 24"><path d="M5 12h13"/><path d="M12.5 6.5 19 12l-6.5 5.5"/></svg></div>`
      : '';
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="theater-head">
        <div class="theater-title">${esc(s.line||'')}<span class="cn">${esc(s.cat||'')}${s.cat?'丨':''}${esc(s.name||'')}</span></div>
        <div class="day-badge">DAY ${n} / ${s.days}</div>
      </div>
      <div class="timeline"><div class="tl-row">${dots}</div></div>
      ${scenes}${more}`;
    card.addEventListener('click',()=>{ location.href='script.html'; });
    wrap.appendChild(card);
    ind.appendChild(document.createElement('i'));
  });
  /* 今日剧场滑卡 —— 小点跟着滑动位置走。只有一部就不摆点 */
  if(list.length > 1){ ind.children[0].classList.add('on'); }
  else { ind.innerHTML = ''; }
}
/* 滑动监听只绑一次 —— 剧场是会重绘的，绑在里面会越堆越多 */
(function(){
  const wrap = document.getElementById('thWrap');
  const ind = document.getElementById('thInd');
  wrap.addEventListener('scroll',()=>{
    const dots = [...ind.children];
    if(dots.length < 2) return;
    const i = Math.round(wrap.scrollLeft / wrap.clientWidth);
    dots.forEach((d,j)=>d.classList.toggle('on', j===i));
  });
})();

/* 有存档就盖回存档，第一次进来待办就是空的 —— 不塞示例数据 */
lsLoad();
renderAff();
bindAff();
renderTodos();
bindTodos();
renderTheater();

/* 从剧本页跳回来数据可能已经变了。PWA 里页面会被复用，不重读就是旧数据 */
window.addEventListener('pageshow',renderTheater);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) renderTheater(); });
</script>

<script>
/* PWA —— 装到桌面用。file:// 下不注册（协议不支持），只在 http/https 生效 */
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
}
</script>
